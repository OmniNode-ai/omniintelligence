#
# CodeQL security and quality analysis for omnibase_core.
# Calls the reusable workflow in onex_change_control.
# OMN-5421

name: Security Scan

on:
  push:
    branches: [main, 'hotfix/**']
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  codeql:
    name: CodeQL
    uses: OmniNode-ai/onex_change_control/.github/workflows/codeql-reusable.yml@c0c49e1240ffaa6db1fe36f74b50c0acd345d7b2
    with:
      language: python
      query_suite: security-extended
    permissions:
      actions: read
      contents: read
      security-events: write

#
# Repo Evidence Gate caller (OMN-20074, OCC retirement OR.6) verifies
# omniintelligence's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
# This is the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The full-SHA pin makes the reusable immutable; verifier-version pins the
# released verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a
# repo-evidence / verify job in this mode as a success no-op (the OCC path,
# switched off by the input); only repo-evidence / dod-verify carries a verdict.
#
# S5 shadow count (OMN-20074): shadow and compare-with-occ are both "true", so
# every run records this head's new-path verdict beside OCC's occ-preflight /
# eligibility verdict on the same head, and no repo-evidence job concludes
# anything but success. The verdict is one `Shadow verdict:` line in the job
# summary and in a notice annotation, the data the S5 count reads.
# repo-evidence / dod-verify is NOT a required context here yet. Every OCC
# context stays required and no OCC caller is removed. Making it required, and
# then removing the OCC contexts (S6), are separate rulings that wait for this
# repository's own S5 bar. The S6 change sets shadow and compare-with-occ back
# to "false".
#
# The reusable is pinned by full SHA to the squash commit of omnibase_core#1914
# on dev, the pin omnibase_core's own caller and omnibase_infra's caller use; it
# carries the `shadow` input. omniintelligence does not host receipt-gate.yml.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@fb0c6c2117d5868a398b0920cd0048d0824415b1 # OMN-20074: immutable full-SHA pin, the squash commit of omnibase_core#1914 on that repo's dev branch (carries the shadow input)
    with:
      evidence-source: caller
      verifier-version: 0.4.305
      compare-with-occ: "true"
      shadow: "true"

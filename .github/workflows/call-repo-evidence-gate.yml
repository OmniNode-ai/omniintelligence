#
# Repo Evidence Gate caller (OMN-20074, OCC retirement OR.6) verifies
# omniintelligence's own contracts/<OMN-N>.yaml at the PR head through
# omnibase_core's receipt-gate reusable with evidence-source: caller.
# This is the path omnimarket proved as the canary (OMN-20070, OMN-20072).
#
# Why pull_request_target: GitHub reads the workflow definition from the BASE
# branch, so a pull request that edits this file or the reusable's pin does not
# change which definition runs on it. The pull request's own code is only ever
# checked out as data by the reusable, which refuses fork heads.
#
# dev and main are the integration branches. The activity types cover new heads,
# reopened and ready PRs, and edits to the ticket citation or base branch.
# Per-PR concurrency cancels superseded runs so the latest event gets a verdict.
# Read-only contents and pull-requests permissions are all this caller needs;
# checkout and verification belong to the reusable, with no caller secrets.
# The full-SHA pin makes the reusable immutable; verifier-version pins the
# released verifier used to read the caller's contracts.
#
# The job id is the context prefix: repo-evidence / dod-verify carries the
# verdict, so do not add a job name. The reusable also reports a
# repo-evidence / verify job in this mode as a success no-op (the OCC path,
# switched off by the input); only repo-evidence / dod-verify carries a verdict.
#
# S6 cut-over (OMN-20074): the caller enforces repo-owned evidence with
# shadow: "false" and compare-with-occ: "false". Admission no longer compares
# against OCC. The comparison was switched off on dev first, because this caller
# runs from dev under pull_request_target and the retiring pull request cannot
# change the input that judges it. No OCC caller remains in this repository, so
# the difference step would otherwise wait for a verdict nobody reports.
# repo-evidence / dod-verify carries the verdict; a repository ruleset on dev is
# to require that context once the OCC contexts have left the ruleset.
# Rollback is setting shadow back to "true", which makes every repo-evidence
# job conclude success again while the cause is found.
#
# The reusable is pinned by full SHA to the squash commit of omnibase_core#1932
# on dev, a descendant of #1914; it carries the `shadow` input. omniintelligence
# does not host receipt-gate.yml.
#
# The pinned reusable refuses a verifier-version below 0.4.303 before installing
# it (VERIFIER_FLOOR, omnibase_core#1932; OMN-20032), the first release that
# refuses a contract leaving a criterion unbound. With shadow "false" that
# install step blocks. verifier-version 0.4.310 is the first omnimarket release
# that ships the writer-app and plugin-manifest diff classifiers
# (omnimarket#3694) and refuses a contract that repeats a mapping key
# (omnimarket#3751), the version omniclaude and omnidash run.

name: Repo Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-evidence:
    uses: OmniNode-ai/omnibase_core/.github/workflows/receipt-gate.yml@4e4f5e0404d364e296c5d37db6aa3ab9e07f8ffa # OMN-20032: immutable full-SHA pin, the squash commit of omnibase_core#1932 on that repo's dev branch; descends from #1914 (carries the shadow input) and adds the VERIFIER_FLOOR 0.4.303 refusal to the verifier install step
    with:
      evidence-source: caller
      verifier-version: 0.4.310
      compare-with-occ: "false"
      shadow: "false"

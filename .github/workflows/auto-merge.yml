#
# OMN-14126: Auto-enrollment is disabled to keep runner pressure and merge
# ordering under manual sweep control. The workflow remains available only as an
# explicit workflow_dispatch helper.
#
# OMN-7786: Re-trigger on review and check_suite events so the workflow
# re-attempts auto-merge after review finishes and branch
# protection gates clear. Silent continue-on-error removed; "already
# enqueued" races are tolerated but real failures surface.
name: Auto-Merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to enable auto-merge on"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and author
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_PAYLOAD: ${{ github.event.pull_request.number }}
          PR_FROM_DISPATCH: ${{ github.event.inputs.pr_number }}
          CHECK_SUITE_PRS: ${{ toJson(github.event.check_suite.pull_requests) }}
          PR_AUTHOR_FROM_PAYLOAD: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              PR="$PR_FROM_DISPATCH"
              ACTOR="$(gh pr view "$PR" --json author --jq '.author.login')"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          {
            echo "pr=$PR"
            echo "actor=$ACTOR"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Resolve repository auto-merge setting
        id: repository-auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/$GH_REPO" --jq '.allow_auto_merge')"
          if [ "$enabled" != "true" ]; then
            echo "repository auto-merge is disabled; arming skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.actor == 'jonahgabriel' && steps.repository-auto-merge.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          if output=$(gh pr merge "$PR" --repo "$GH_REPO" --squash --auto 2>&1); then
            echo "auto-merge enabled: $output"
            exit 0
          fi
          if echo "$output" | grep -qiE "already enqueued|already queued|auto-merge already enabled"; then
            echo "auto-merge not newly enabled (expected): $output"
            exit 0
          fi
          echo "auto-merge failed: $output"
          exit 1

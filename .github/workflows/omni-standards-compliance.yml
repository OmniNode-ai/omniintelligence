---
name: Omni* Ecosystem Standards Compliance

on:
  push:
    branches: [main, develop, 'hotfix/**']
  pull_request:
    branches: [main, dev, develop]
  merge_group:
  workflow_dispatch:

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.3"
  REPO_NAME: "omniintelligence"

# ci-health-ok: blocking mypy already enforced in ci.yml type-check job (scoped to tools/utils/runtime)

jobs:
  type-union-check:
    name: PEP 604 Type Union Check (UP007)
    # OMN-17427: this repository is public, so its CI runs on GitHub-hosted runners only
    # (RULING 2026-10-16T07:07:09Z); check-public-runner-placement refuses any runs-on that is not a literal hosted label.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check for Optional/Union usage (PEP 604)
        run: uv run ruff check src/ --select UP007,UP006

  ci-naming-convention:
    name: CI Naming Convention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify CI workflow naming convention
        run: |
          if [ ! -f .github/workflows/ci.yml ]; then
            echo "::error::Missing .github/workflows/ci.yml"
            exit 1
          fi
          CI_NAME=$(grep -m1 "^name:" .github/workflows/ci.yml | sed "s/name: *//" | tr -d "'\"")
          if [ "$CI_NAME" != "CI" ]; then
            echo "::error::ci.yml has name '$CI_NAME' — must be 'CI'"
            exit 1
          fi
          for legacy in test.yml ci.yaml; do
            if [ -f ".github/workflows/$legacy" ]; then
              echo "::error::Legacy workflow .github/workflows/$legacy exists"
              exit 1
            fi
          done
          echo "CI naming convention: PASS"

  handler-contract-compliance:
    name: Handler Contract Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install omnibase_core (pinned)
        # --no-config: pyproject.toml [tool.uv] override-dependencies pins omnibase-core to the
        # PyPI range and would replace this git sha with a release that lacks the validator.
        run: uv pip install --system --no-config "omnibase-core @ git+https://github.com/OmniNode-ai/omnibase_core.git@c584a652ae32c7e672521f660872c354d6e36325"

      - name: Run handler contract compliance check
        run: |
          python -m omnibase_core.handlers.handler_arch_handler_contract_compliance \
            --repo-root . \
            --allowlist-path arch-handler-contract-compliance-allowlist.yaml

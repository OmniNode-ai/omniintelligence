#
# Public Repo Hygiene -- thin caller. OMN-18016, epic OMN-17992.
#
# This repository is PUBLIC. The gate refuses internal operating detail landing
# in it: an undeclared top-level directory, an agent-state or evidence tree, a
# misplaced dated document, a brand asset, an env file, cloud identity, a
# private address, an operator machine path, a private repository name, and
# internal-KB prose in a public README.
#
# mode: report. The gate records every finding and exits 0 for the residue the
# tree already carries, so it does not block unrelated PRs. It flips to enforce
# when that residue is FIXED -- never by moving it into
# .public-repo-hygiene.yaml.
#
# Five classes already fail the run, on ADDED lines only (OMN-20783):
# private-repo-name, internal-kb-prose, lab-config, person-name and
# private-network, set by `enforce_classes` and `enforce_scope: added-lines` in
# .public-repo-hygiene.yaml. The reusable hands the gate the merge ref's first
# parent as its diff base, so a pull request that adds one of those goes red
# and one that does not stays green over the residue. The pre-commit hook runs
# the same gate at the same revision (see .pre-commit-config.yaml); advance the
# two together.
#
# Layer (a) reads .public-repo-hygiene.yaml at this repo's root; the gate
# refuses to run without it rather than treating an absent config as an empty
# allowlist.
#
# `secrets: inherit` IS REQUIRED: the denylist vocabulary lives in a private
# repository and the reusable workflow mints an installation token to read it.
# Without the secrets the gate fails CLOSED, which is the correct behaviour and
# a loud one.
#
# The pin is a SINGLE source of truth: the reusable workflow checks its own
# validator out at validated job.workflow_sha, i.e. this very SHA, so the workflow
# and the script can never drift apart. Pin to an omniclaude commit on `dev`;
# `main` is release-synced and does not carry the gate.

name: Public Repo Hygiene

on:
  pull_request:
    branches: [dev]

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  public-repo-hygiene:
    uses: OmniNode-ai/omniclaude/.github/workflows/public-repo-hygiene-reusable.yml@6e47aa311ac5d177d116d9597b07966a233d2463
    with:
      mode: report
    secrets: inherit

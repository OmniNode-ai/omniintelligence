name: Hardcoded Model Config

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardcoded-model-config:
    uses: OmniNode-ai/omniclaude/.github/workflows/hardcoded-model-config-reusable.yml@acc1daf137d38246e98d0dad29267f2cbad14f5f
    with:
      core_ref: f873d2c30201c05d4be020fa0b281b5edbfb8307

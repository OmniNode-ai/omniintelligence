#
# Secrets Baseline Wiring Gate — thin caller. OMN-18669.
#
# This repository carries `.secrets.baseline`. That file is the allowlist a
# detect-secrets scan is judged against, and on its own it is inert: it blocks
# nothing, it proves nothing, and it looks exactly like a repository that is
# protected. Measured 2026-09-18 across the registry, one repo carried a
# baseline no hook and no workflow read; a full scan against it surfaced 47
# findings in 18 files nothing had ever been asked to approve.
#
# So this gate refuses the silent state: a repo carrying the baseline owes BOTH
# a pre-commit entry and a CI workflow that read it, and neither substitutes for
# the other. A repo with no baseline passes — the gate never demands one.
#
# Validator + reusable workflow live in omniclaude, pinned by immutable SHA and
# never @main: omniclaude's main is release-synced and does not carry either.
# The pin is a SINGLE source of truth — the reusable checks its validator out at
# github.job_workflow_sha, i.e. this very SHA — so advancing the gate is one
# line here, plus the matching `rev:` in .pre-commit-config.yaml, in one PR.
#
# Surfaced context: 'secrets-baseline-wiring / secrets-baseline-wiring' (this
# job's id / the reusable job's name). Removing this file removes the CI half
# and the local hook then fails the repo on its own next commit.

name: Secrets Baseline Wiring Gate

on:
  pull_request:
    branches: [dev]

jobs:
  secrets-baseline-wiring:
    uses: OmniNode-ai/omniclaude/.github/workflows/secrets-baseline-wiring-reusable.yml@42b994826519e8d6bc21d0ca915803084c7c3955

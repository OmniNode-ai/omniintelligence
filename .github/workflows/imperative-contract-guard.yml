name: Imperative Contract Guard

on:
  pull_request:
  push:
    branches:
      - main

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions:
  contents: read

jobs:
  imperative-contract-guard:
    # self-gating-ok: central guard is intentionally shared across repos; caller PRs do not modify the referenced workflow.
    # OMN-21005: caller-owned historical allowlist; core enforces shrink-only changes.
    uses: OmniNode-ai/omnibase_core/.github/workflows/imperative-contract-guard.yml@70f7ceda44af968ccf26264ecd429cfd27503971
    with:
      allowlist-path: .github/imperative-contract-allowlist.yaml

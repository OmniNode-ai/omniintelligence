# Calls the reusable ban-hardcoded-runner-ip check from omniclaude.
# Implements OMN-10603.

name: Ban Hardcoded Runner IP

on:
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/**
      - tests/**

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  ban-hardcoded-runner-ip:
    # OMN-17993: pinned to an exact SHA, not @main. omniclaude main lags dev by
    # design (release-synced), so @main still resolves to the pre-widening scanner
    # body that scans workflow files only and exits 0 on a tests-only diff.
    uses: OmniNode-ai/omniclaude/.github/workflows/ban-hardcoded-runner-ip.yml@6e7ea2464ca835f7b0a9dfe4f4c923053e5facf0  # OMN-20074: omniclaude#2656 squash, the reusable scans without the nested change-control preflight
    permissions:
      contents: read
      pull-requests: read

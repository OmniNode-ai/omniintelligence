name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  pr-title:
    # OMN-21003: the decision moved out of the change-control repository's
    # pr-title-check-reusable.yml into omnimarket's node_pr_title_check_compute,
    # run here from a pinned omnimarket release. The job keeps the id `pr-title`
    # and the name the reusable call produced, so the required context
    # `pr-title / check-title` does not move. The node prints the same lines and
    # exits 0 (admit) or 1 (refuse) as the old bash step; 2 is a malformed request.
    # No checkout: the decision reads only the event's title and author.
    name: pr-title / check-title
    # OMN-17427: this repository is public, so its CI runs on GitHub-hosted runners only
    # (RULING 2026-10-16T07:07:09Z); check-public-runner-placement refuses any runs-on that is not a literal hosted label.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Check PR title for ticket reference
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OMNIMARKET_VERSION: "0.4.310"
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pr-title-check"
          uv venv --quiet --python 3.12 "${venv}"
          # The node imports only pydantic, so omnimarket's own dependency tree is not installed.
          uv pip install --quiet --python "${venv}/bin/python" --no-deps "omnimarket==${OMNIMARKET_VERSION}"
          uv pip install --quiet --python "${venv}/bin/python" "pydantic>=2.11"
          "${venv}/bin/python" -I -c 'import json, os; print(json.dumps({"title": os.environ["PR_TITLE"], "author": os.environ["PR_AUTHOR"]}))' \
            | "${venv}/bin/python" -I -m omnimarket.nodes.node_pr_title_check_compute

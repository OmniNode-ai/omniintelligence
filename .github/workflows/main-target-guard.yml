---
# SPDX-FileCopyrightText: 2026 OmniNode.ai Inc.
# SPDX-License-Identifier: MIT
#
# OMN-12243: Block PRs targeting main.
#
# OMN-20074: no exception is left. `main` is release-synced: release.yml
# ("Sync main to release tag") advances it by a fast-forward over the REST API
# and opens no pull request against it, and dev is the default branch, so a PR
# that targets main violates the rule. The promotion-receipt shape this guard
# used to admit exists nowhere in that workflow.

name: Main target guard

on:
  pull_request:
    types: [opened, edited, synchronize]

# OMN-19646: cancel only superseded pull request runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  main-target-guard:
    name: main-target-guard
    # OMN-17427: this repository is public, so its CI runs on GitHub-hosted runners only
    # (RULING 2026-10-16T07:07:09Z); check-public-runner-placement refuses any runs-on that is not a literal hosted label.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "::notice::PR targets '${BASE_REF}', not main; guard does not apply."
            exit 0
          fi

          echo "::error::PR from '${HEAD_REF}' targets main, which is release-synced and never a pull-request target."
          echo "::error::The release workflow moves main by fast-forwarding it to the published tag; it opens no PR against main."
          echo "::error::Retarget this PR to dev."
          exit 1

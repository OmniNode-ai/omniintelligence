---
schema_version: 1.0.0
ticket_id: OMN-21746
title: omniintelligence contracts_and_di literal_timeout burn-down, slice rf1320-c2 -- the remaining timeouts
  are read from runtime_timeouts.yaml
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core as locked, validator ValidatorContractsAndDi)
  reported 16 literal_timeout findings on dev at 98b21c0e and 0 after this change; the other rules did
  not move (literal_topic 60, handler_hand_construction 67, literal_url 31, literal_path 12, literal_model_name
  9) and nothing new appeared. Eight new required fields of runtime/runtime_timeouts.yaml carry the values
  (utilization_llm_s, github_api_s, code_embed_s, projection_throttle_s, heartbeat_s, promotion_interval_s,
  health_shutdown_s, forecast_max_ci_width) and the consumers read them through ModelRuntimeTimeouts.
  The introspection heartbeat and the promotion scheduler interval now default to None and resolve from
  the contract; the DEFAULT_INTERVAL_SECONDS constant is removed. The navigation retriever node tests
  derive their timeouts from the contract and wait on an event that never fires in place of a numeric
  sleep. Nothing remains to be done for this rule in this repository.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21746-timeouts-from-contract
    statement: Every remaining timeout, interval and poll budget of the touched modules comes from runtime_timeouts.yaml
      through ModelRuntimeTimeouts and the modules hold no such literal.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_timeout over the slice paths drops to
          zero and the repo total drops by the slice size, with no baseline entry or suppression added
          -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over omniintelligence
          src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every moved timeout is taken through an injected parameter bound from the node
          contract or overlay and none remains hard-coded in the touched code -- falsifier: uv run pytest
          tests/unit -q over the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: Contract tests for the new fields and the scheduler, projection throttle and heartbeat
      defaults, plus the runtime timeouts contract tests of OMN-21623.
    command: uv run pytest tests/unit/runtime/test_runtime_timeouts_slice_omn21746.py tests/unit/runtime/test_runtime_timeouts_contract_omn21623.py
      -q -n 0

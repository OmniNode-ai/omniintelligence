          src/omniintelligence/nodes/node_intelligence_reducer/node_tests/test_node_pattern_lifecycle_integration.py
          src/omniintelligence/nodes/node_policy_state_reducer/node_tests tests/unit/runtime/test_dispatch_handler_code_entity_bridge.py
          tests/unit/test_node_purity.py -q
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn21785-ac3-unit-suite
    description: The slice's focused tests pass at the PR head.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest src/omniintelligence/nodes/node_watchdog_effect/node_tests/test_governance_invariants.py
          src/omniintelligence/nodes/node_intelligence_reducer/node_tests/test_node_pattern_lifecycle_integration.py

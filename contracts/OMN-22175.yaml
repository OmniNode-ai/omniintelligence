---
schema_version: 1.0.0
ticket_id: OMN-22175
title: Agent review receipt variant and the verifier node
summary: >-
  Adds the agent receipt variant hostile_review_agent_receipt.v1, issued by node_review_receipt_issue_compute,
  and the pure-compute node node_review_agent_receipt_verify_compute, which checks a signed agent receipt
  against the exact pull request head and returns accepted or one typed refusal.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn22175-agent-receipt-verifier
    statement: A signed agent review receipt is accepted only for the exact pull request head, at the
      injected quorum, from approved voters whose provenance the policy does not forbid.
    acceptance:
      - id: AC1
        statement: Each of the twelve named refusal tests returns its own typed reason and the accept
          case returns accepted with the voter identities.
      - id: AC2
        statement: The quorum size is an input.
      - id: AC3
        statement: No class, provider, endpoint or host is a literal in the node.
      - id: AC4
        statement: The node registers and loads through dependency injection in both profiles.
evidence_requirements:
  - kind: tests
    description: Run the verifier unit tests and the profile check.
    command: uv run pytest tests/unit/nodes/node_review_agent_receipt_verify_compute -v -rs
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn22175-ac1-refusals
    description: Reject a verifier whose fifteen plain tests do not all pass with no skip.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_review_agent_receipt_verify_compute/test_agent_receipt_verify.py
          -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn22175-ac2-quorum-input
    description: Reject a verifier whose quorum size is not an input.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_review_agent_receipt_verify_compute/test_agent_receipt_verify.py::test_quorum_follows_injected_size
          -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn22175-ac3-no-literals
    description: Reject a handler that names a class, provider, endpoint or host, or a node that ignores
      an injected policy value.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_review_agent_receipt_verify_compute/test_no_policy_literals.py
          tests/unit/nodes/node_review_agent_receipt_verify_compute/test_agent_receipt_verify.py::test_policy_values_are_data
          -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3
  - id: dod-omn22175-ac4-profiles
    description: Reject a node that does not load and answer in both the inmemory and the redpanda_overlay
      profile.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_review_agent_receipt_verify_compute/test_node_loading.py
          -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC4

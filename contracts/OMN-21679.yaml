schema_version: 1.0.0
ticket_id: OMN-21679
title: omniintelligence contracts_and_di handler_hand_construction burn-down, slice rf1120-c2
summary: 'The read-only contracts_and_di scan of omniintelligence src/ (ValidatorContractsAndDi through
  runtime_validator_run) reported 106 findings before this change and 76 after it; handler_hand_construction
  went from 63 to 33, literal_topic (36) and literal_url (7) are unchanged. This slice removes 30 of them:
  the handler each of twelve node shells built by hand (13 constructions), HandlerGitRepoCrawl in the
  git repo crawler handler tests (16) and NodeCrawlSchedulerEffect in the crawl scheduler node_tests conftest
  (1). Each is now built in a container binding module (the binding site the checker allows) and the caller
  resolves it from there, the pattern OMN-21785 set. Files touched by the open omniintelligence PR 1192
  (handler_review_rubric_check.py, cli_review.py) are left out of this slice.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21679-slice
    statement: The slice's hand-built handlers and nodes leave the touched code and are resolved from
      a binding module.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for handler_hand_construction over the slice paths
          drops to zero and the repo total drops by the slice size, with no baseline entry or suppression
          added -- falsifier: onex run of runtime_validator_run with the contracts_and_di reference over
          omniintelligence src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every moved value is read from a node contract or overlay through an injected
          setting and no literal of it remains in the touched code -- falsifier: uv run pytest tests/unit
          -q over the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'

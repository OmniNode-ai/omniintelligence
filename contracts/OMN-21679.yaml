---
schema_version: 1.0.0
ticket_id: OMN-21679
title: omniintelligence contracts_and_di handler_hand_construction burn-down, slice rf1120-c2 -- handlers
  are bound through the node contract that declares them
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core f5cb99be1, validator ValidatorContractsAndDi)
  reported 51 handler_hand_construction findings on dev 67914815 and reports 10 after this change, with
  every other rule's count unchanged. Handlers and nodes no longer name a handler class they build by
  hand: the node's contract.yaml handler_routing names the module and class for an operation, and ModelContractHandlerBinding
  (read through bind_contract_handler) resolves that class, checks it against the type the caller expects
  and returns the instance with its injected dependencies. Nine node shells, five handler entry points,
  the two hook registries, the Claude Code review host, the CI fingerprint dispatch handler and the git
  repo crawler tests bind this way; four contract files gain an operation entry for the binding and four
  gain a class key on an existing entry. HandlerConfig, HandlerRouting and NodeFamily are data models
  and take the Model prefix the repository naming rules already require, which also removes four entries
  from the burn-down baseline. The two bloom eval nodes, the Gmail Slack notifier, two review_pairing
  sites, the code entity bridge dispatch handler and four node-conformance tests still build their dependency
  by hand and are listed in the pull request. No baseline entry and no suppression is added.
is_seam_ticket: false
interface_change: false
interfaces_touched: []

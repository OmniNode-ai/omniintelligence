summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core dev, validator ValidatorContractsAndDi)
  at dev 1f848845 reported 187 findings, 31 of them literal_url. This slice removes 24 literal_url findings
  (187 to 163, no other rule moved, nothing added): 23 in the embedding generation node tests and 1 in
  the context item writer node tests. The embedding server URL and the Qdrant URL now sit in a test_endpoints.yaml
  beside each test module, read with yaml.safe_load; a file missing a field fails to load. No request
  leaves the process in these tests. The seven findings left are in files other lanes or open PRs hold:
  runtime/dispatch_handlers.py and node_intelligence_reducer handler_process.py and its test (handler-shape
  branches), node_navigation_retriever_effect test (open PR 1181), node_llm_routing_decision_effect conftest
  (pushed branch omn-20930-omniintelligence-endpoint-defaults).

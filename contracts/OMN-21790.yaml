summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core as locked, validator ValidatorContractsAndDi)
  reported literal_path 12 and literal_model_name 9 on dev at 9e010740 and 0 for both after this change;
  the other rules did not move (literal_topic 60, handler_hand_construction 67, literal_url 31) and nothing
  new appeared, total 179 to 158. The two plan reviewer clients read their model from ModelLlmRoutingSettings
  (two new overlay variables); code_projection requires CODE_PROJECTION_EMBEDDING_MODEL and CODE_PROJECTION_EMBEDDING_MODEL_VERSION
  from the overlay in place of built-in defaults; EnumReviewModel values are derived from member names
  and stay identical to the migration 020 model_id keys; the crawl scheduler governance tests take their
  source paths from tmp_path. Seven baseline entries of the hardcoded-model-config baseline that these
  files no longer need are removed; none added.

---
schema_version: 1.0.0
ticket_id: OMN-23486
title: The intelligence service's parts that ask the runtime for things it does not supply can be built
  at start-up
summary: >-
  The one runtime builds each routed handler class from the event bus, the container and the ownership
  query only. Seven omniintelligence handler classes (nine routed entries) had another required constructor
  parameter, so the dev roll of 2026-11-10T07:30Z stopped at HandlerStreak with a TypeError and the boot
  guard restored the previous image. Each of the seven now builds with no argument, still takes its dependency
  by keyword, and raises a plain error at call time when the dependency is absent. The loader-shape test
  gains a case per routed handler that runs the runtime's own handler resolver.
is_seam_ticket: true
interface_change: true
interfaces_touched:
  - public_api
requirements:
  - id: req-omn23486-handlers-build
    statement: Every handler class an omniintelligence node contract routes to is built by the runtime's
      handler resolver with no argument the runtime does not supply.
    acceptance:
      - id: AC1
        statement: A test runs the runtime's handler resolver over every routed handler and fails on the
          nine routed entries that need a constructor argument today.
      - id: AC2
        statement: The seven handler classes build with no argument and still take their dependency by
          keyword.
      - id: AC3
        statement: No other omniintelligence handler or contract changes, apart from the operation key
          on the eleven routing entries of the Claude and Cursor hook event contracts.
      - id: AC4
        statement: Integrated - the dev runtime boots with the omniintelligence node contracts loaded
          and GET /api/v1/patterns on the dev runtime answers 200 after the deploy agent rolls dev.
evidence_requirements:
  - kind: tests
    description: Run the loader-shape test, which now builds every routed handler through the resolver.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_contract_handler_loader_shape.py
      -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn23486-ac1-resolver-builds-every-handler
    description: The resolver builds every routed handler; the case fails with a TypeError naming the
      constructor parameters on the unfixed handlers.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_contract_handler_loader_shape.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
      - AC2
  - id: dod-omn23486-ac3-only-handlers-change
    description: The change touches the seven handler files, the two hook event contracts, the loader-shape
      test and this contract.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          test "$(git diff --name-only origin/dev...HEAD | grep -vc '^src/omniintelligence/nodes/.*/handlers/.*\.py$\|^src/omniintelligence/nodes/node_\(claude\|cursor\)_hook_event_effect/contract\.yaml$\|^tests/unit/test_contract_handler_loader_shape\.py$\|^contracts/OMN-23486\.yaml$')"
          = 0
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3
  - id: dod-omn23486-ac4-integration-proof
    description: After the deploy agent rolls dev, GET /api/v1/patterns on the dev runtime answers 200;
      a runtime that failed to build a routed handler never reaches this answer.
    source: manual
    execution_scope: local_done_gate
    checks:
      - check_type: command
        check_value: test "$(curl -s -o /dev/null -w '%{http_code}' "${OMNIINTELLIGENCE_DEV_RUNTIME_URL}/api/v1/patterns?limit=1")"
          = 200
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC4

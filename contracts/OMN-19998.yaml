---
schema_version: "1.0.0"
ticket_id: "OMN-19998"
title: "An exhausted review budget is a timeout the substitute-vote policy may replace"
summary: >-
  A chunked review shares one voter's sequential worst-case budget. When that budget runs out the adapter
  now fails the voter with the transport's timeout error, as a single call that ran past its timeout did
  before chunking, so the substitute-vote policy reads it as a voter that timed out. The quorum, the budget
  and the receipt rules are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "review-budget-timeout"
    statement: "A voter whose shared review budget runs out fails as a timed-out voter."
    acceptance:
      - id: "AC1"
        statement: "An exhausted review budget fails the vote with the timeout error code, and the substitute-vote
          policy classifies it as timed out."
  - id: "req-omn19998-omniintelligence-dev-merge-tag"
    statement: "Operator RULING 2026-10-16T09:35:49Z: tags replace releases, made automatic. omniintelligence,
      a sibling another platform repository consumes, tags every push to dev with a lightweight dev-<UTC
      YYYYMMDDHHMMSS>-<sha12> tag on the pushed commit, idempotent per commit, with no tag on any other
      ref, so a consumer can pin it through a uv git source."
    acceptance:
      - id: "AC2"
        statement: "AC2: .github/workflows/dev-merge-tag.yml triggers only on push to dev, and its tag
          step, run against a throwaway repository with a +05:30 committer date, pushes one lightweight
          tag named dev-<committer time in UTC>-<sha12> at the commit, pushes nothing on a second run
          or when a dev tag for that sha already exists, pushes nothing in a dry run, and refuses a value
          that is not a full sha -- falsifier: uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py
          -q -n 0 fails at the merge base, where the workflow does not exist"
evidence_requirements:
  - kind: "tests"
    description: "The exhausted budget is a failed vote that the substitute-vote policy may replace."
    command: "uv run pytest tests/unit/review_pairing/test_large_diff_json_review.py -q -n 0"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "review-budget-timeout-substitutable"
    description: "An exhausted shared budget fails the vote as a timeout that receipts may replace."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_large_diff_json_review.py -q -n 0 -k
          'exhausted_budget_is_a_substitutable_timeout'"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1"]
  - id: "dod-omn19998-omniintelligence-dev-merge-tag"
    description: "The dev merge tag tests pass at the head; at the merge base the workflow file does not
      exist and every test fails."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_dev_merge_tag_workflow_omn19998.py -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC2"]
  - id: "dod-omn19998-omniintelligence-dev-tag-probe"
    description: "Hosted-runner probe reads the dev merge tag workflow at this commit and requires its
      push-to-dev trigger and its tag push; the base has no such file and the probe fails."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: >-
          gh api "repos/OmniNode-ai/omniintelligence/contents/.github/workflows/dev-merge-tag.yml?ref=$(git
          rev-parse HEAD)" --jq .content | base64 -d | awk '/branches: \[dev\]/{a=1} /git push origin
          "refs\/tags\//{b=1} END{exit !(a&&b)}'
        cwd: "."

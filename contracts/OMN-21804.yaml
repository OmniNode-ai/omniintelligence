schema_version: 1.0.0
ticket_id: OMN-21804
title: omniintelligence contracts_and_di literal_topic burn-down, slice rf1550-c6 -- topics are read from
  node contracts
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core as locked, validator ValidatorContractsAndDi)
  reported 60 literal_topic findings on dev at 9e010740 and 36 after this change (24 fewer); the other
  rules did not move (handler_hand_construction 67, literal_url 31, literal_path 12, literal_model_name
  9) and nothing new appeared. Six node test modules read their publish topic from the owning node contract
  through the contract topic reader, the review pairing topic enum reads its five values from review_pairing/contract.yaml
  (which now also declares calibration-run-completed as a publish topic), and the additional code-analysis
  subscribe topic is read from the intelligence orchestrator contract. The remaining 36 are constants.py
  (32), three topics.py literals no node contract declares, and the utilization-scoring subscribe topic.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21804-topics-from-contract
    statement: Every topic of the touched modules is read from the owning node contract and the modules
      hold no such literal.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_topic over the slice paths drops to zero
          and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier:
          onex run of runtime_validator_run with the contracts_and_di reference over omniintelligence
          src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every topic comes from the owning node contract or overlay and is injected, none
          hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over the touched modules
          plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:

---
schema_version: "1.0.0"
ticket_id: "OMN-20910"
title: "Review-voter models are declared in a contract overlay, not repo variables or workflow files"
summary: "The Hostile Reviewer gate reads its voters from a review_voters_overlay.v1 contract overlay:
  a new COMPUTE node, node_review_voters_overlay_compute, validates it and resolves each voter's endpoint
  from the lab delegation overlay or the voter's own endpoint_url, with model selection, sampling, focus,
  timeout and a required flag. cli_review and retry_budget take --voters-overlay; a required voter that
  is unreachable or fails exits 2 naming it. The quorum policy is unchanged."
is_seam_ticket: false
interface_change: true
interfaces_touched:
  - "public_api"
requirements:
  - id: "req-voters-from-overlay"
    statement: "The gate's voters, with model, endpoint, sampling and focus, come from the overlay and
      nowhere else."
    acceptance:
      - id: "AC1"
        statement: "AC1: a contract overlay declares each review voter with model, endpoint, sampling
          and focus, and the gate resolves voters only from it -- falsifier: uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py
          -q -k removed_from_the_overlay"
      - id: "AC2"
        statement: "AC2: swapping a voter's model is an overlay-only diff that changes the resolved call
          target -- falsifier: uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py
          -q -k changing_the_backend_changes_the_model"
  - id: "req-compact-verdict-prompt-v2"
    statement: "Review prompt 2.0.0 asks for a compact verdict that ModelReviewVerdictCompact validates,
      a typed ModelReviewCallResponse carries the provider's stop reason from the Claude API and OpenAI-compatible
      transports, and prompt 1.5.0 stays selectable and byte for byte."
    acceptance:
      - id: "AC10"
        statement: "AC10: the compact models refuse done absent, X or R: without a family and a catalog
          code with a family, a max_tokens stop reason is not a normal end, and the default prompt is
          the frozen v1 text -- falsifier: uv run pytest tests/unit/review_pairing/test_compact_verdict_omn20910.py
          -q -n 0 fails at the merge base"
  - id: "req-claude-api-error-detail"
    statement: "Claude API failures expose the provider's error type and message when both are strings,
      without including unrelated response fields."
    acceptance:
      - id: "AC11"
        statement: "AC11: a non-200 Claude API response includes valid error.type and error.message in
          a single-line suffix of at most 200 characters, excludes unrelated response fields, and keeps
          status-only errors for malformed bodies -- falsifier: uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py
          -q -k 'provider_error_summary or malformed_provider_error_keeps_status_only'"
  - id: "req-otel-security-update"
    statement: "The telemetry dependency lock admits the opentelemetry-api security update despite omnibase-infra's
      transitive contrib caps."
    acceptance:
      - id: "AC12"
        statement: "AC12: the lock resolves both opentelemetry-api and opentelemetry-sdk to 1.45.1 or
          newer, excluding the affected releases through 1.45.0."
      - id: "AC13"
        statement: "AC13: all six infra instrumentation overrides admit contrib 0.66b1 and their locked
          versions are at least 0.66b1 and satisfy the declared overrides."
  - id: "req-claude-voter-max-tokens-retry"
    statement: "A Claude API voter whose review reply stops at max_tokens takes the JSON-only retry with
      twice the output budget, and any other incomplete stop fails the vote naming its stop reason."
    acceptance:
      - id: "AC14"
        statement: "AC14: a review chunk whose Claude reply stops at max_tokens is retried once with JSON
          only and doubled max_tokens; a retry also cut fails as an unparseable reply keeping usage; a
          refusal fails without retry naming stop_reason=refusal; call_model still raises on max_tokens
          -- falsifier: uv run pytest tests/unit/review_pairing/test_claude_voter_max_tokens_retry_omn20910.py
          -q"
evidence_requirements:
  - kind: "tests"
    description: "A voter removed from the overlay is not called."
    command: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q -k removed_from_the_overlay"
  - kind: "tests"
    description: "Changing a voter's backend in the overlay changes its call target and nothing else."
    command: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q -k changing_the_backend_changes_the_model"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn20910-claude-api-error-detail"
    description: "Claude API HTTP 400 errors include the provider's type and message, collapse whitespace,
      truncate the suffix to 200 characters, exclude an unrelated synthetic credential field, and retain
      status-only errors for malformed bodies."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -k 'provider_error_summary or malformed_provider_error_keeps_status_only'"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC11"]
  - id: "dod-omn20910-otel-security-update"
    description: "Read the lock's API and SDK versions; both tests fail against the prior 1.42.1 lock."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_otel_security_dependencies_omn20910.py -q -n 0 --no-cov
          -k test_locked_telemetry_excludes_affected_versions"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC12"]
  - id: "dod-omn20910-otel-contrib-compatibility"
    description: "Read all six instrumentation constraints and locked versions; the previous caps and
      lock cannot admit the contrib release that accompanies the secure API."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_otel_security_dependencies_omn20910.py -q -n 0 --no-cov
          -k test_contrib_constraints_admit_secure_telemetry"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC13"]
  - id: "dod-omn20910-contract-host-handler"
    description: "The contract-bound typed host handler injects the pool interpreter and permitted host
      environment into the review effect. The new node package and its handlers are covered by package
      import checks."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_claude_code_pool_voter.py -q -k contract_bound_handler"
        cwd: "${OMNI_HOME}/omniintelligence"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/test_package_installability.py -q"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-claude-code-pool"
    description: "Claude Code voters use the host account pool, mark and rotate a usage-limited account,
      fail closed with a named reason when all accounts are limited, and emit no token values. The overlay
      selects the model without an API key or HTTP endpoint."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_claude_code_pool_voter.py -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20910-http-overflow-regression"
    description: "The production HTTP review handler falls through a retryable primary response for every
      chunk, including delayed model discovery, while retaining signing, sampling, focus and repository
      metadata. Separate deadline tests cover slow and silent endpoints."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_large_diff_json_review.py -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20910-anthropic-overlay"
    description: "A provider anthropic overlay voter reaches the Messages API with the declared model,
      fails closed with its name when the named key variable is missing, records token usage and counts
      aliases of the same provider/model only once. No live provider call or credential change."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20910-ac1-voters-from-overlay"
    description: "A voter removed from the overlay is not called; invalid or unreachable voters fail naming
      the voter."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -k removed_from_the_overlay"
        cwd: "${OMNI_HOME}/omniintelligence"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -k 'naming or names_the_voter'"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac2-overlay-only-swap"
    description: "Changing a voter's backend in the overlay changes its resolved call target."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -k changing_the_backend_changes_the_model"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC2"]
  - id: "dod-omn20910-chunk-scaled-review-deadline"
    description: "A voter's overlay review_deadline_seconds lets a chunked review take timeout_seconds
      per chunk, at least one call's worst case and at most that ceiling; the CI retry-budget check counts
      the ceiling, and a review past it is still a substitutable timeout. Without the field the deadline
      is unchanged."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_chunk_deadline_omn20910.py -q
          -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1"]
  - id: "dod-omn20910-ac10-compact-verdict-prompt-v2"
    description: "Compact verdict models, the typed call response with its stop reason, and prompt 2.0.0
      with v1 selectable."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_compact_verdict_omn20910.py -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC10"]
  - id: "dod-omn20910-overlay-v2-personas-identity"
    description: "review_voters_overlay.v2 declares up to three personas per voter with tier and mode,
      gives every Claude gateway host serving one model the one identity anthropic#id=<model>, refuses
      an overflow onto another voter's own endpoint, and counts persona, chunk and attempt calls in the
      review deadline. v1 overlays resolve and budget exactly as before and refuse every v2 field."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_v2_omn20910.py
          -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_review_voters_overlay_omn20910.py -q
          -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC1", "AC2"]
  - id: "dod-omn20910-claude-voter-max-tokens-retry"
    description: "A Claude API review reply cut at max_tokens reaches the JSON-only retry with doubled
      max_tokens instead of failing the vote; a second cut fails as unparseable with usage kept; a refusal
      names its stop reason; the v1 text call still raises."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/review_pairing/test_claude_voter_max_tokens_retry_omn20910.py
          -q -n 0"
        cwd: "${OMNI_HOME}/omniintelligence"
    binds_ac: ["AC14"]

title: "The PR review tells every voter which repository the diff belongs to, so a cloud voter can refuse
  the one repository that never goes to a cloud model"
summary: "Operator RULING 2026-10-13T20:50:03Z keeps one repository's code away from cloud models and
  allows cloud review of every other repository. The cloud review voter endpoint refuses that repository
  and refuses a review that names no repository. cli_review already receives --repo from the Hostile Reviewer
  workflow; it now passes it through run_review and async_parse_raw to call_model, which sends it in the
  signed request body as metadata.repository. A review with no repository sends exactly the body it sent
  before."

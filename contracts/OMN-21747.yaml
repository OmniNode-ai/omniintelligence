---
schema_version: 1.0.0
ticket_id: OMN-21747
title: omniintelligence handler-shape burn-down, slice rf1320-s1 -- eleven handler modules become handler classes
summary: >-
  The handler-shape validator (omnibase_core ValidatorHandlerShape) reported 39 findings over
  omniintelligence src (37 module_function_handler, 2 mutating_public_method). This slice fixes the
  12 findings of the eleven handler modules that no contract.yaml binds: each module now holds a
  Handler class, the old public module functions are removed and every caller calls the class. Nine
  of the eleven take one typed request model in handle(request); five request models are new. The
  intent graph and policy lifecycle modules become stateless classes of static methods with no
  handle entry. The finding feedback handler takes a typed signal model in handle and its unused
  public clear() is removed. No contract.yaml, baseline, allowlist or suppression changed, and no
  handler names the event envelope. After the slice the validator reports 27 findings, all
  module_function_handler in contract-bound modules of nodes on the canonical handler-shape
  baseline, left for a later slice that carries adequacy receipts.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21747-handler-shape-slice
    statement: The eleven slice handler modules hold a handler class, take a typed request model, and
      name no event envelope; the validator reports no finding on them.
    acceptance:
      - id: AC1
        statement: 'AC1: the handler-shape finding count over the slice paths drops to zero with no baseline
          entry or suppression added -- falsifier: ValidatorHandlerShape run over omniintelligence src
          before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: the touched handlers take a typed request model and name no event envelope, and
          no per-node unwrapper is added -- falsifier: uv run pytest tests/unit -q over the touched modules
          plus the handler-shape re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of the
          tests and the validator re-run -- falsifier: uv run pytest tests/unit -q on the lab through lab-run
          at the PR head, receipt path in the PR body'
evidence_requirements:

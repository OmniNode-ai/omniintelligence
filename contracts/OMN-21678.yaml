schema_version: 1.0.0
ticket_id: OMN-21678
title: omniintelligence contracts_and_di literal_model_name burn-down, slice rf1120-c1 -- model names
  are injected from the deployment overlay through ModelLlmRoutingSettings
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core as locked, validator ValidatorContractsAndDi
  through runtime_validator_run) reported 30 literal_model_name findings on dev at 67914815 and 9 after
  this change; the other rules did not move (literal_topic 92, literal_url 48, literal_timeout 30, literal_path
  14, literal_port 5, literal_ip 2, literal_host 1) and nothing new appeared. The 21 findings in seven
  files no longer hold a model name. The deployment overlay now supplies the names through ModelLlmRoutingSettings
  (OMNIINTELLIGENCE_GMAIL_INTENT_EMBEDDING_MODEL, OMNIINTELLIGENCE_GMAIL_INTENT_CHAT_MODEL, OMNIINTELLIGENCE_UTILIZATION_SCORING_MODEL,
  OMNIINTELLIGENCE_PATTERN_COMPLIANCE_MODEL, OMNIINTELLIGENCE_RL_EXPORT_MODELS and OMNIINTELLIGENCE_EVAL_COST_RATES);
  the repository holds no model name, because the hardcoded-model-config gate pinned in this repository
  refuses one in any tracked file. A name the overlay does not supply is unset: the eval cost table is
  empty (every rate it held was zero), the RL export omits the model field, and a request that must carry
  a model name sends the placeholder default. The RL backend slugs are derived from the RoutingAction
  member names. The embedding provider enum value that selected the custom /embed endpoint is renamed
  to custom_embed, because it named a protocol and not a model. The 17 hardcoded-model-config baseline
  entries of those files are removed. Not in this slice: the plan reviewer Gemini and z.ai default models
  (the literal_url PR touches those files), the code projection embedding model pair (the timeouts and
  literal_url PRs touch those files), and the three EnumReviewModel values, which are the model_id keys
  of migration 020 and review_pairing/model_registry.yaml.
is_seam_ticket: false
interface_change: false
interfaces_touched: []

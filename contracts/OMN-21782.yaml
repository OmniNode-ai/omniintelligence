---
schema_version: 1.0.0
ticket_id: OMN-21782
title: omniintelligence contracts_and_di literal_host, literal_ip and literal_port burn-down, slice rf1500-c6
summary: >-
  The read-only contracts_and_di scan of omniintelligence at dev 9e010740 (omnibase_core 0.47.60, validator
  ValidatorContractsAndDi) over src/ reports no literal_host, literal_ip or literal_port finding (the
  earlier slice of OMN-21680 removed them); over scripts/ it reported one, a literal_host in scripts/verify_pattern_lifecycle_e2e.py
  (scripts total 9 findings before, 8 after). The script guessed the omnidash analytics DSN by testing
  the infra DSN for a loopback host name; that branch is gone, so the DSN comes only from OMNIDASH_ANALYTICS_DB_URL
  and the check skips when it is unset. Remaining on dev for this lane's rules after the change: literal_host
  0, literal_ip 0, literal_port 0 over src/ and scripts/.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21782-slice
    statement: The host literal leaves scripts/verify_pattern_lifecycle_e2e.py and the omnidash DSN is
      read only from the environment setting.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_host, literal_ip and literal_port over
          the slice paths drops to zero and the repo total drops by the slice size, with no baseline entry
          or suppression added -- falsifier: onex run of runtime_validator_run with the contracts_and_di
          reference over omniintelligence src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every host, address and port comes from the owning node contract or overlay and
          is injected, none hard-coded in the touched code -- falsifier: uv run pytest tests/unit -q over
          the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'
evidence_requirements:
  - kind: tests
    description: Regression test that runs the checker on the script and the skip path without a DSN.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_verify_pattern_lifecycle_e2e_hosts_omn21782.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21782-ac1-checker-rerun
    description: The checker scans the slice path and reports no literal_host, literal_ip or literal_port
      finding; a missing file or an incomplete scan fails.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          env PYTHONDONTWRITEBYTECODE=1 uv run python -c 'import sys; from pathlib import Path; from omnibase_core.validation.validator_contracts_and_di
          import ValidatorContractsAndDi; paths = [Path(p) for p in sys.argv[1:]]; assert paths and all(p.is_file()
          for p in paths), "missing slice path"; result = ValidatorContractsAndDi().validate(paths); assert
          result.metadata is not None and result.metadata.files_processed == len(paths), "incomplete scan";
          findings = [i for i in result.issues if i.rule_name in {"literal_host", "literal_ip", "literal_port",
          "unparseable_file"}]; print(result.summary); [print(i) for i in findings]; sys.exit(bool(findings))'
          scripts/verify_pattern_lifecycle_e2e.py
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn21782-ac2-values-from-setting
    description: The regression tests pass and the script no longer derives the omnidash DSN from the
      infra DSN by testing it for a loopback host name.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts/test_verify_pattern_lifecycle_e2e_hosts_omn21782.py
          -q
        cwd: ${OMNI_HOME}/omniintelligence
      - check_type: command
        check_value: "! grep -nE 'infra_dsn|\"localhost\" in' scripts/verify_pattern_lifecycle_e2e.py"
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn21782-ac3-unit-suite
    description: The slice's focused tests pass at the PR head on the lab.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/scripts -q
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3

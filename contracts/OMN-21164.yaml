      0.25.0, and CHANGELOG.md has a 0.25.0 entry that names the v0.24.0 window. At the merge base pyproject.toml
      reads 0.24.0 and there is no CHANGELOG.md.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          grep -q '^version = "0.25.0"$' pyproject.toml && grep -A1 '^name = "omninode-intelligence"$'
          uv.lock | grep -q '^version = "0.25.0"$' && grep -q '^## \[0.25.0\]' CHANGELOG.md && grep -q

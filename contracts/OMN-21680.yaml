---
schema_version: 1.0.0
ticket_id: OMN-21680
title: omniintelligence contracts_and_di burn-down, slice rf1120-c3 -- bind address and listener ports
  move into a contract file, in-memory stand-ins leave runtime code and test conftests
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core dev, validator ValidatorContractsAndDi)
  reported 277 findings before this change and 263 after it. This slice removes 14 of them: five literal_port,
  two literal_ip, one literal_host, two literal_path and four inmemory_outside_injection. The bind address
  and the four listener ports (runtime health, runtime metrics, stub launcher health, decision_store health)
  now sit in runtime/runtime_bindings.yaml, read through ModelRuntimeBindings; a file missing a field,
  naming an unknown one or holding a port outside 1..65535 fails to load. The runtime config, the stub
  launcher and the decision_store entrypoint read them from there; their environment overrides stay. PluginIntelligence.wire_dispatchers
  no longer builds an in-memory idempotency store as a fallback and returns a failed result when the store
  is absent. The three node test conftests that built an in-memory store by hand resolve it from a container
  module in the node's node_tests, the binding site the checker allows. The two test path literals use
  tmp_path and a HOME set to it. The 12 literal_path findings in node_crawl_scheduler_effect/node_tests/test_governance_invariants.py
  stay because pushed branch omn-21536-handler-classes-effect-slice rewrites that file.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21680-slice
    statement: The slice's bind address, listener ports, path literals and in-memory stand-ins leave the
      touched code and are read from a contract file or a binding module.
    acceptance:
      - id: AC1
        statement: 'AC1: the contracts_and_di count for literal_path over the slice paths drops to zero
          and the repo total drops by the slice size, with no baseline entry or suppression added -- falsifier:
          onex run of runtime_validator_run with the contracts_and_di reference over omniintelligence
          src before and after, counts compared per rule'
      - id: AC2
        statement: 'AC2: every moved value is read from a node contract or overlay through an injected
          setting and no literal of it remains in the touched code -- falsifier: uv run pytest tests/unit
          -q over the touched modules plus the checker re-run on the slice paths'
      - id: AC3
        statement: 'AC3: the slice lands as one PR titled with this ticket id and carries lab proof of
          the tests and the checker re-run -- falsifier: uv run pytest tests/unit -q on the lab through
          lab-run at the PR head, receipt path in the PR body'

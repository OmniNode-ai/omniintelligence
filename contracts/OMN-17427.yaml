  - id: dod-omn17427-docs-inventory
    description: Enumerate tracked documentation and tool-input text, root README pointer, license and
      packaging metadata.
    source: manual
    checks:
      - check_type: command
        check_value: >-
          python3 -c 'import pathlib,subprocess,tomllib; expected=set([".claude/architecture-handshake.md",
          ".github/ISSUE_TEMPLATE/bug_report.md", ".github/ISSUE_TEMPLATE/feature_request.md", ".github/PULL_REQUEST_TEMPLATE.md",
          ".onex_ratchets/canonical_file_shape_baseline.txt", "CLAUDE.md", "README.md", "scripts/validation/topic_naming_baseline.txt",
          "src/omniintelligence/review_pairing/personas/analytical-strict.md", "tests/fixtures/code_projection/v2/sanitized/greeter-class-v2.txt",
          "tests/fixtures/code_projection/v2/sanitized/greeter-class.txt", "tests/fixtures/code_projection/v2/sanitized/widget-interface.txt",
          "tests/unit/review_pairing/fixtures/large_free_text_reply.txt"]); actual={p for p in subprocess.check_output(["git","ls-files"],text=True).splitlines()
          if p.endswith((".md",".mdx",".rst",".adoc",".txt"))}; assert actual==expected,(actual-expected,expected-actual);
          r=pathlib.Path("README.md").read_text(); assert 3<=len(r.splitlines())<=5; assert "https://github.com/OmniNode-ai/knowledge_base"
          in r; metadata=tomllib.loads(pathlib.Path("pyproject.toml").read_text()); assert metadata["project"]["readme"]=="README.md";
          assert "Changelog" not in metadata["project"]["urls"]; assert pathlib.Path("LICENSE").is_file();
          print("PASS: 13 approved prose/tool-input files, README pointer, license, package metadata")'

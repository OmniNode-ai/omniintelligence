---
schema_version: 1.0.0
ticket_id: OMN-17427
title: The retry of an unparseable review reply runs with a larger token budget
summary: A Hostile Reviewer reply that reaches the 4096-token cap stops mid-JSON and does not parse; the
  one retry resent the same cap, so a long review failed twice and the required voter did not vote. The
  retry now asks for 8192 tokens. The first call, the per-call timeout, the number of calls and the quorum
  are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-retry-token-budget
    statement: The retry of an unparseable reviewer reply has room to finish a review the default cap
      cut off, and a reply that still does not parse still fails the vote.
    acceptance:
      - id: AC1
        statement: 'AC1: async_parse_raw retries an unparseable reply once with max_tokens=_RETRY_MAX_TOKENS
          (8192) and the same prompt and model, the first call keeps the 4096 default, and call_model
          sends the budget it is given on the inference request -- falsifier: tests/unit/review_pairing/test_unparseable_retry_token_budget.py
          fails at the merge base (uv run pytest on that file)'
      - id: AC2
        statement: 'AC2: a reply that does not parse on both calls still marks the voter failed (parse_failed,
          success false), so the quorum still reads degraded and is never lowered -- falsifier: the same
          test file and tests/unit/review_pairing/test_unparseable_reply_fails_omn20422.py (uv run pytest
          on both files)'
  - id: req-public-runner-placement
    statement: 'Operator RULING 2026-10-16T07:07:09Z: CI runners are for private repositories only. omniintelligence
      is public, so every workflow job runs on a literal GitHub-hosted label, the normalization-symmetry
      hook is registered under repos and names a module that exists, and omnibase_core''s check-public-runner-placement
      runs as a CI Summary required job and as a pre-commit hook at one core release.'
    acceptance:
      - id: AC3
        statement: 'AC3: no workflow names the self-hosted fleet or computes a runs-on label from a variable,
          the Public Runner Placement job is unconditional, hosted, carries a positive control and the
          same core release as the pre-commit hook, and CI Summary requires its success -- falsifier:
          uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q -n 0 fails at the merge base,
          where 33 workflow jobs fall back to the omnibase-ci fleet and neither the job nor the hook exists'
      - id: AC4
        statement: 'AC4: the normalization-symmetry hook is a registered hook under repos whose python
          -m target is an importable omnibase_core module -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn17427.py::test_normalization_symmetry_hook_runs_an_importable_module
          -q -n 0 fails at the merge base, where the hook block sits inside the top-level exclude scalar
          and names omnibase_core.validators.normalization-symmetry'
  - id: req-docs-centralization
    statement: Standalone human documentation is removed from omniintelligence while machine-read inputs
      and the public knowledge base pointer remain.
    acceptance:
      - id: AC101
        statement: 'AC101: the tracked prose and text inventory contains only the root README pointer,
          CLAUDE.md, CI architecture handshake, issue and PR templates, review persona, ratchet baselines
          and test fixture data; README.md has 3-5 lines and links to the public knowledge_base; package
          metadata no longer links to the removed changelog.'
      - id: AC102
        statement: 'AC102: existing persona and code-projection artifact tests continue reading their
          retained markdown and text inputs.'
evidence_requirements:
  - kind: tests
    description: Retry budget, unchanged first call, request wiring and the failed-vote path.
    command: uv run pytest tests/unit/review_pairing/test_unparseable_retry_token_budget.py tests/unit/review_pairing/test_unparseable_reply_fails_omn20422.py
      -q -n 0
  - kind: tests
    description: The placement tests read every workflow file for the fleet fallback and a computed runs-on,
      the ci.yml job, .pre-commit-config.yaml and the CI Summary wiring.
    command: uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q -n 0

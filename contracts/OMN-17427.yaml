    description: The retry asks for the larger budget with the same prompt; call_model sends it.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/review_pairing/test_unparseable_retry_token_budget.py -q
          -n 0
    binds_ac:
      - AC1
  - id: dod-omn17427-ac2-failed-vote-kept
    description: Unparseable on both calls is still a failed vote.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/review_pairing/test_unparseable_retry_token_budget.py tests/unit/review_pairing/test_unparseable_reply_fails_omn20422.py
          -q -n 0
    binds_ac:
      - AC2
  - id: dod-omn17427-ac3-public-runner-placement
    description: AC3 tests read the workflows, the CI job, the pre-commit hook and the CI Summary wiring.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q -n 0
    binds_ac:
      - AC3
  - id: dod-omn17427-ac4-normalization-symmetry-hook
    description: AC4 test reads the registered hook and resolves its module.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/ci/test_public_runner_placement_omn17427.py::test_normalization_symmetry_hook_runs_an_importable_module
          -q -n 0
    binds_ac:

---
schema_version: 1.0.0
ticket_id: OMN-17427
title: The retry of an unparseable review reply runs with a larger token budget
summary: A Hostile Reviewer reply that reaches the 4096-token cap stops mid-JSON and does not parse; the
  one retry resent the same cap, so a long review failed twice and the required voter did not vote. The
  retry now asks for 8192 tokens. The first call, the per-call timeout, the number of calls and the quorum
  are unchanged.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-retry-token-budget
    statement: The retry of an unparseable reviewer reply has room to finish a review the default cap
      cut off, and a reply that still does not parse still fails the vote.
    acceptance:
      - id: AC1
        statement: 'AC1: async_parse_raw retries an unparseable reply once with max_tokens=_RETRY_MAX_TOKENS
          (8192) and the same prompt and model, the first call keeps the 4096 default, and call_model
          sends the budget it is given on the inference request -- falsifier: tests/unit/review_pairing/test_unparseable_retry_token_budget.py
          fails at the merge base (uv run pytest on that file)'
      - id: AC2
        statement: 'AC2: a reply that does not parse on both calls still marks the voter failed (parse_failed,
          success false), so the quorum still reads degraded and is never lowered -- falsifier: the same
          test file and tests/unit/review_pairing/test_unparseable_reply_fails_omn20422.py (uv run pytest
          on both files)'
  - id: req-public-runner-placement
    statement: 'Operator RULING 2026-10-16T07:07:09Z: CI runners are for private repositories only. omniintelligence
      is public, so every workflow job runs on a literal GitHub-hosted label, the normalization-symmetry
      hook is registered under repos and names a module that exists, and omnibase_core''s check-public-runner-placement
      runs as a CI Summary required job and as a pre-commit hook at one core release.'
    acceptance:
      - id: AC3
        statement: 'AC3: no workflow names the self-hosted fleet or computes a runs-on label from a variable,
          the Public Runner Placement job is unconditional, hosted, carries a positive control and the
          same core release as the pre-commit hook, and CI Summary requires its success -- falsifier:
          uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q -n 0 fails at the merge base,
          where 33 workflow jobs fall back to the omnibase-ci fleet and neither the job nor the hook exists'
      - id: AC4
        statement: 'AC4: the normalization-symmetry hook is a registered hook under repos whose python
          -m target is an importable omnibase_core module -- falsifier: uv run pytest tests/ci/test_public_runner_placement_omn17427.py::test_normalization_symmetry_hook_runs_an_importable_module
          -q -n 0 fails at the merge base, where the hook block sits inside the top-level exclude scalar
          and names omnibase_core.validators.normalization-symmetry'
  - id: req-docs-centralization
    statement: Standalone human documentation is removed from omniintelligence while machine-read inputs
      and the public knowledge base pointer remain.
    acceptance:
      - id: AC101
        statement: 'AC101: the tracked prose and text inventory contains only the root README pointer,
          CLAUDE.md, CI architecture handshake, issue and PR templates, review persona, ratchet baselines
          and test fixture data; README.md has 3-5 lines and links to the public knowledge_base; package
          metadata no longer links to the removed changelog.'
      - id: AC102
        statement: 'AC102: existing persona and code-projection artifact tests continue reading their
          retained markdown and text inputs.'
  - id: req-overflow-vote-deadline
    statement: A review voter with an overflow endpoint keeps its whole-vote deadline. The last endpoint
      of a chunk is bounded by the vote's remaining time rather than by half of that chunk's even share,
      and an endpoint that failed over during one vote is not retried by the later chunks of that vote.
      The quorum, the required voters and the vote deadline are unchanged.
    acceptance:
      - id: AC5
        statement: 'AC5: with a primary that never answers and an overflow that answers in 60s, a 2-chunk
          review under a 200s vote deadline succeeds through the overflow -- falsifier: tests/unit/review_pairing/test_large_diff_json_review.py::test_the_last_endpoint_is_bounded_by_the_vote_not_its_chunk_share
          fails at the merge base with endpoint exceeded its request timeout'
      - id: AC6
        statement: 'AC6: with 16 chunks, a 1200s vote deadline, a silent primary and a 40s overflow, the
          primary is called once and the overflow 16 times, and the vote ends inside its deadline -- falsifier:
          tests/unit/review_pairing/test_large_diff_json_review.py::test_a_primary_that_failed_a_chunk_is_not_retried_in_the_same_vote
          fails at the merge base'
  - id: req-review-bot-judges-rejections
    statement: The review bot judges a rejected Hostile Reviewer finding. A judge the CI overlay declares
      in rejection_judge.yaml, never a voter of the review roster by voter id or reviewer identity, reads
      the finding, the cited lines at the head and the rejection through the reviewer's own call_model,
      and answers accepted or refused with one sentence; anything that stops a judgement is returned as
      data so the caller fails closed, and with nothing to judge no overlay is read.
    acceptance:
      - id: AC103
        statement: 'AC103: a judge sharing a voter id or reviewer identity is never chosen, the prompt
          fences the pull request text as data, accepted and refused verdicts are recorded per rejection,
          an answer that is no verdict is retried once then noted, an unconfigured judge, a refused voters
          overlay or a failed call is returned as data with exit 1, and an empty batch reads no overlay
          -- falsifier: uv run pytest tests/unit/review_pairing/test_review_rejection_judge_omn17427.py
          -q -n 0'
      - id: AC104
        statement: 'AC104: the rejection judge contract binds an importable handler class whose typed
          handle(request) method selects the independent judge and returns its plan -- falsifier: uv run
          pytest tests/unit/review_pairing/test_review_rejection_judge_omn17427.py::TestPlan::test_contract_dispatches_to_the_typed_handler
          -q fails without the class binding'
  - id: req-repository-contract-migration
    statement: The closer can read the three migrated ticket contracts from this repository without losing
      their source evidence.
    acceptance:
      - id: AC105
        statement: 'AC105: contracts/OMN-16764.yaml, contracts/OMN-17492.yaml and contracts/OMN-21047.yaml
          parse as their own ticket contracts and retain the exact source blob bytes copied from OCC commit
          49cfc14c21a2c50f9964c1aeed4b66001ce279a3 -- falsifier: uv run pytest tests/unit/test_migrated_ticket_contracts_omn17427.py
          -q fails at the merge base where the three repository-local contracts are absent.'
evidence_requirements:
  - kind: tests
    description: Retry budget, unchanged first call, request wiring and the failed-vote path.
    command: uv run pytest tests/unit/review_pairing/test_unparseable_retry_token_budget.py tests/unit/review_pairing/test_unparseable_reply_fails_omn20422.py
      -q -n 0
  - kind: tests
    description: The placement tests read every workflow file for the fleet fallback and a computed runs-on,
      the ci.yml job, .pre-commit-config.yaml and the CI Summary wiring.
    command: uv run pytest tests/ci/test_public_runner_placement_omn17427.py -q -n 0
  - kind: tests
    description: Overflow voter keeps its vote deadline and skips an endpoint that failed over in the
      same vote.
    command: uv run pytest tests/unit/review_pairing/test_large_diff_json_review.py tests/unit/review_pairing/test_review_voter_overflow.py
      -q -n 0
  - kind: tests
    description: The rejection judge node and cli_review judge-rejections with real overlay files and
      the model call replaced; one case runs the real call_model with the judge's key unset.
    command: uv run pytest tests/unit/review_pairing/test_review_rejection_judge_omn17427.py -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''

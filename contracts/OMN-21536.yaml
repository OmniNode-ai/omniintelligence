---
schema_version: "1.0.0"
ticket_id: "OMN-21536"
title: "Six single-request compute handlers become handler classes with handle(request)"
summary: "The six compute nodes whose handler is one function of one typed request (ci_error_classifier,
  semantic_analysis, success_criteria_matcher, execution_trace_parser, pattern_matching, code_entity_bridge)
  now bind a handler class with handle(self, request) in their contracts, and the old function names are
  removed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-handler-classes"
    statement: |-
      Each of the six compute nodes delegates to a handler class exposing handle(request); no module-level handler function remains.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the unit tests of the six converted handlers call the handler classes and pass -- falsifier: uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute tests/unit/nodes/node_success_criteria_matcher_compute tests/unit/nodes/node_execution_trace_parser_compute tests/unit/nodes/node_pattern_matching_compute tests/unit/nodes/node_code_entity_bridge_compute -q
  - id: "req-pattern-handler-classes"
    statement: |-
      Each handler module of node_pattern_learning_compute and node_pattern_assembler_orchestrator holds a handler class exposing handle(request) with a typed request model, and no bare public handler function remains.
    acceptance:
      - id: "AC2"
        statement: |-
          AC2: the unit tests of the pattern learning and pattern assembler nodes call the handler classes and pass, and the canonical-dispatch parity tests of the two contract-bound handlers pass -- falsifier: uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator tests/unit/test_node_purity.py -q
  - id: "req-eval-handler-classes"
    statement: |-
      Ten further handler modules (agent_behavior_eval, anti_gaming_guardrails, behavior_scenario_generator, chunk_classifier, debug_retrieval, intent_cost_forecast, intent_drift_detect, memory_eval, objective_ab_framework, review_rubric_check) hold a handler class exposing handle(request) with a typed request model; the module_function_handler findings for them are gone.
    acceptance:
      - id: "AC3"
        statement: |-
          AC3: the unit tests of the ten converted handlers, including the canonical parity tests, call the handler classes and pass -- falsifier: uv run pytest tests/nodes/node_agent_behavior_eval_compute tests/nodes/node_memory_eval_compute tests/nodes/node_behavior_scenario_generator_compute tests/unit/nodes/node_debug_retrieval_compute tests/unit/nodes/node_review_rubric_check_compute tests/unit/nodes/node_intent_cost_forecast_compute tests/unit/nodes/node_intent_drift_detect_compute src/omniintelligence/nodes/node_chunk_classifier_compute/node_tests src/omniintelligence/nodes/node_anti_gaming_guardrails_compute/node_tests src/omniintelligence/nodes/node_objective_ab_framework_compute/node_tests -q
evidence_requirements:
  - kind: "tests"
    description: "Handler-class unit tests for the six nodes pass."
    command: "uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute
      -q"
  - kind: "tests"
    description: "Handler-class unit tests of the pattern learning and pattern assembler nodes pass."
    command: "uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator
      -q"
  - kind: "tests"
    description: "Handler-class unit tests and canonical parity tests for the ten further nodes pass."
    command: "uv run pytest tests/nodes/node_memory_eval_compute tests/unit/nodes/node_intent_drift_detect_compute
      -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""
dod_evidence:
  - id: "dod-omn21536-ac1-handler-classes"
    description: "The converted handler classes are exercised by their unit tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute
          -q"
    binds_ac: ["AC1"]
  - id: "dod-omn21536-ac2-pattern-handler-classes"
    description: "The converted pattern learning and pattern assembler handler classes are exercised by
      the unit tests of the two nodes."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator
          -q"
    binds_ac: ["AC2"]
  - id: "dod-omn21536-ac3-eval-handler-classes"
    description: "The ten further converted handler classes are exercised by their unit and parity tests."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/nodes/node_memory_eval_compute tests/unit/nodes/node_intent_drift_detect_compute
          -q"
    binds_ac: ["AC3"]

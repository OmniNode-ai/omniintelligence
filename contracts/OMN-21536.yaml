schema_version: "1.0.0"
ticket_id: "OMN-21536"
title: "Six single-request compute handlers become handler classes with handle(request)"
summary: "The six compute nodes whose handler is one function of one typed request (ci_error_classifier,
  semantic_analysis, success_criteria_matcher, execution_trace_parser, pattern_matching, code_entity_bridge)
  now bind a handler class with handle(self, request) in their contracts, and the old function names are
  removed."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-handler-classes"
    statement: |-
      Each of the six compute nodes delegates to a handler class exposing handle(request); no module-level handler function remains.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the unit tests of the six converted handlers call the handler classes and pass -- falsifier: uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute tests/unit/nodes/node_success_criteria_matcher_compute tests/unit/nodes/node_execution_trace_parser_compute tests/unit/nodes/node_pattern_matching_compute tests/unit/nodes/node_code_entity_bridge_compute -q
  - id: "req-handler-classes-effect-reducer"
    statement: |-
      Ten effect, reducer and compute nodes (dispatch_outcome_eval, doc_retrieval, doc_promotion, document_fetch, intelligence_reducer, intelligence_orchestrator, enforcement_feedback, scoring_reducer, policy_state_reducer, intent_graph_reducer) bind handler classes with handle(request) in their contracts; no module-level handler function remains in their handler modules.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: the unit tests of the ten converted nodes and the dispatch bridges call the handler classes and pass -- falsifier: uv run pytest tests/unit/nodes/node_dispatch_outcome_eval_effect tests/unit/nodes/node_intelligence_orchestrator tests/unit/nodes/node_enforcement_feedback_effect tests/unit/nodes/node_intent_graph_reducer tests/unit/runtime/test_dispatch_handler_orchestrator.py -q

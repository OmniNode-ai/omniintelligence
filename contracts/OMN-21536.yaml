---
schema_version: 1.0.0
ticket_id: OMN-21536
title: Compute, pattern, pattern extraction and four effect handlers become handler classes with handle(request)
summary: 'The six compute nodes whose handler is one function of one typed request (ci_error_classifier,
  semantic_analysis, success_criteria_matcher, execution_trace_parser, pattern_matching, code_entity_bridge)
  now bind a handler class with handle(self, request) in their contracts, and the old function names are
  removed. Eleven handler modules of node_pattern_extraction_compute held only module functions, several
  of them with three to six positional arguments, and core''s handler-shape validator reported each as
  module_function_handler. Each module now also holds a handler class whose handle takes one typed request,
  and the contract binds the five extraction operations to those classes (class: in place of function:).
  The module functions are unchanged; the classes call them. Five request models are new (ModelSessionPatternRequest,
  ModelFilePatternRequest, ModelCoreExtractionRequest, ModelMatchPatternRequest, ModelMergeInsightsRequest)
  and the converters take a request and response model pair. The node leaves the canonical handler-shape
  baseline with an adequacy receipt and a hand-flip proof, five handler files leave the canonical-file-shape
  burn-down baseline, and no baselined file grew. The canon-shape-ratchet job now checks out full history
  so a hand-flip proof can resolve its base_ref. This slice does not finish the ticket: the validator
  still reports the module-function handlers of the other nodes. The gmail intent evaluator, git repo
  crawler and code crawler effect nodes now bind a handler class with handle(self, request) in their contracts,
  the Claude Code review effect handler becomes a class that the host handler constructs, and the old
  function names are removed. The three flipped nodes carry adequacy receipts and hand-flip proofs.'
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-handler-classes
    statement: Each of the six compute nodes delegates to a handler class exposing handle(request); no
      module-level handler function remains.
    acceptance:
      - id: AC1
        statement: 'AC1: the unit tests of the six converted handlers call the handler classes and pass
          -- falsifier: uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute
          tests/unit/nodes/node_success_criteria_matcher_compute tests/unit/nodes/node_execution_trace_parser_compute
          tests/unit/nodes/node_pattern_matching_compute tests/unit/nodes/node_code_entity_bridge_compute
          -q'
  - id: req-pattern-handler-classes
    statement: Each handler module of node_pattern_learning_compute and node_pattern_assembler_orchestrator
      holds a handler class exposing handle(request) with a typed request model, and no bare public handler
      function remains.
    acceptance:
      - id: AC2
        statement: 'AC2: the unit tests of the pattern learning and pattern assembler nodes call the handler
          classes and pass, and the canonical-dispatch parity tests of the two contract-bound handlers
          pass -- falsifier: uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator
          tests/unit/test_node_purity.py -q'
  - id: req-omn21536-oi-pattern-extraction-handle-request
    statement: The five extraction operations of node_pattern_extraction_compute bind a handler class
      with a typed handle(request), and each class returns what the module function it replaces returns.
    acceptance:
      - id: AC4
        statement: 'AC4: node_pattern_extraction_compute is absent from the canonical handler-shape baseline
          and carries an adequacy receipt and a hand-flip proof that the ratchet verifies -- falsifier:
          the Canonical Handler-Shape Ratchet job exits non-zero, or the node id is still in scripts/ci/canonical_handler_shape_baseline.py'
      - id: AC5
        statement: 'AC5: the class bound in each of the five operations takes one typed request and returns,
          for the recorded fixtures, what the module function returns, and the contract names no function
          -- falsifier: the pytest command of the evidence below exits non-zero'
      - id: AC6
        statement: 'AC6: the handler-shape validator reports no finding in the node and none of the eleven
          handler modules, and still reports a module of bare functions -- falsifier: the test_handle_request_shape_omn21536.py
          tests fail'
  - id: "req-handler-shape-slice-4"
    statement: "The handler modules of the ci failure tracker, execution trace parser, pattern compliance
      and pattern promotion nodes hold typed handler classes that delegate to the unchanged module functions."
    acceptance:
      - id: "AC7"
        statement: "AC7: ValidatorHandlerShape reports no finding on the handler modules of the four nodes
          -- falsifier: the validator run over those modules exits non-zero"
      - id: "AC8"
        statement: "AC8: each new handler class returns what the preserved module function returns on
          the parity cases -- falsifier: a parity test fails"
      - id: "AC9"
        statement: "AC9: the ci failure tracker, pattern compliance and pattern promotion nodes are absent
          from the NON_CANONICAL baseline and each carries an adequacy receipt and a hand-flip proof --
          falsifier: the canonical handler-shape ratchet reports an unproven flip"
  - id: req-effect-handler-classes
    statement: Each of the four effect nodes delegates to a handler class exposing handle(request); no
      module-level handler function remains.
    acceptance:
      - id: AC3
        statement: 'AC3: the unit tests of the four converted handlers call the handler classes and pass
          -- falsifier: uv run pytest tests/unit/nodes/node_gmail_intent_evaluator_effect tests/unit/nodes/node_code_crawler_effect
          src/omniintelligence/nodes/node_git_repo_crawler_effect tests/unit/review_pairing/test_claude_code_pool_voter.py
          -q'
evidence_requirements:
  - kind: tests
    description: Handler-class unit tests for the six nodes pass.
    command: uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute
      -q
  - kind: tests
    description: Handler-class unit tests of the pattern learning and pattern assembler nodes pass.
    command: uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator
      -q
  - kind: tests
    description: Contract binding, output equality with the module functions, and the handler-shape check
      of each of the eleven modules, run on a lab host at the pushed head.
    command: uv run pytest tests/unit/nodes/node_pattern_extraction_compute -q -n 0 --no-cov
  - kind: tests
    description: Handler-class unit tests for the four nodes pass.
    command: uv run pytest tests/unit/nodes/node_gmail_intent_evaluator_effect tests/unit/nodes/node_code_crawler_effect
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21536-ac1-handler-classes
    description: The converted handler classes are exercised by their unit tests.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_ci_error_classifier_compute tests/unit/nodes/node_semantic_analysis_compute
          -q
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_gmail_intent_evaluator_effect tests/unit/nodes/node_code_crawler_effect
          -q
    binds_ac:
      - AC1
      - AC3
  - id: dod-omn21536-ac2-pattern-handler-classes
    description: The converted pattern learning and pattern assembler handler classes are exercised by
      the unit tests of the two nodes.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_pattern_learning_compute tests/unit/nodes/node_pattern_assembler_orchestrator
          -q
    binds_ac:
      - AC2
  - id: dod-omn21536-oi-pe-ac1-baseline-and-receipts
    description: The node id is not in the baseline, and the node has an adequacy receipt and a hand-flip
      proof whose parity block passes.
    source: manual
    checks:
      - check_type: command
        check_value: uv run --frozen python -c 'import json; from pathlib import Path; n="node_pattern_extraction_compute";
          assert "omniintelligence.nodes."+n not in Path("scripts/ci/canonical_handler_shape_baseline.py").read_text();
          d=Path("scripts/ci/adequacy_receipts"); assert json.loads((d/("omniintelligence.nodes."+n+".handflip.json")).read_text())["parity"]["status"]=="pass"
          and (d/("omniintelligence.nodes."+n+".json")).exists()'
    binds_ac:
      - AC4
  - id: dod-omn21536-oi-pe-ac2-bound-class-output
    description: The contract-bound class of each of the five operations returns what the module function
      returns, and no operation binds a function.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_pattern_extraction_compute/test_contract_bound_handlers_omn21536.py
          -q -n 0 --no-cov
    binds_ac:
      - AC5
  - id: dod-omn21536-oi-pe-ac3-handler-shape
    description: Each of the eleven handler modules passes the handler-shape rules, and the same check
      flags a module of bare functions.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/nodes/node_pattern_extraction_compute/test_handle_request_shape_omn21536.py
          -q -n 0 --no-cov
    binds_ac:
      - AC6
  - id: "dod-omn21536-ac2-validator"
    description: "The handler-shape validator reports nothing on the handler modules of the four nodes."
    source: "manual"
    checks:
      - check_type: "command"
        check_value: "uv run --frozen python -m omnibase_core.nodes.node_validation_report_write_effect.runtime_validator_run
          omnibase_core.validation.validator_handler_shape:ValidatorHandlerShape src/omniintelligence/nodes/node_ci_failure_tracker_effect/handlers/handler_streak.py
          src/omniintelligence/nodes/node_ci_failure_tracker_effect/handlers/handler_trigger_record.py
          src/omniintelligence/nodes/node_execution_trace_parser_compute/handlers/handler_event_extraction.py
          src/omniintelligence/nodes/node_execution_trace_parser_compute/handlers/handler_trace_parsing.py
          src/omniintelligence/nodes/node_pattern_compliance_effect/handlers/handler_compliance.py src/omniintelligence/nodes/node_pattern_compliance_effect/handlers/handler_compute.py
          src/omniintelligence/nodes/node_pattern_promotion_effect/handlers/handler_metrics.py src/omniintelligence/nodes/node_pattern_promotion_effect/handlers/handler_promotion.py"
    binds_ac: ["AC7"]
  - id: "dod-omn21536-ac3-parity"
    description: "The parity tests of the four handler-class groups pass."
    source: "manual"
    checks:
      - check_type: "test_passes"
        check_value: "uv run pytest tests/unit/nodes/node_ci_failure_tracker_effect/test_handler_class_shape.py

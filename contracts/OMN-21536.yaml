          tests/unit/nodes/node_pattern_promotion_effect/test_handler_class_shape.py -q -n 0 --no-cov"
    binds_ac: ["AC8"]
  - id: "dod-omn21536-ac4-baseline"
    description: "None of the three flipped nodes is listed in the NON_CANONICAL baseline."
    source: "manual"
    checks:

---
schema_version: 1.0.0
ticket_id: OMN-18595
title: Release version and dependency checks permit subsequent releases
summary: Keep the 0.25.2 release floor and historical changelog entry, require the current project version
  to match the editable lock entry and a changelog block, and retain the transformers 5.10.1 floor while
  allowing dependency refreshes.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-0-25-2
    statement: Release metadata stays consistent at or above 0.25.2, including later scheduled releases.
    acceptance:
      - id: AC1
        statement: The project version is at least 0.25.2.
      - id: AC2
        statement: The changelog retains v0.25.2 and includes the current project version.
      - id: AC3
        statement: The unique editable lock root matches the project version and is at least 0.25.2.
      - id: AC4
        statement: The release retains a unique transformers entry at least 5.10.1 with distribution artifacts.
      - id: AC5
        statement: The release checks accept subsequent releases and reject downgrades, stale root versions,
          missing current changelog entries and transformers downgrades.
evidence_requirements:
  - kind: tests
    description: Run the release metadata checks and their valid and invalid snapshot regressions.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18595-ac1-pyproject-version
    description: The project version is at least 0.25.2.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q -k test_pyproject_declares_0_25_2
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn18595-ac2-changelog-block
    description: The changelog retains v0.25.2 and includes the current project version.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q -k test_changelog_has_0_25_2_block
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn18595-ac3-lock-root-version
    description: The unique editable lock root matches the project version and is at least 0.25.2.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q -k test_lock_root_entry_declares_0_25_2
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3
  - id: dod-omn18595-ac4-transformers-lock
    description: The release retains a unique transformers entry at least 5.10.1 with distribution artifacts.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q -k test_lock_keeps_transformers_5_10_1
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC4
  - id: dod-omn18595-release-test
    description: Verify the release floor, editable lock agreement and transformers floor together.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
      - AC3
      - AC4
  - id: dod-omn18595-release-check-regressions
    description: The release checks accept subsequent releases and reject downgrades, stale root versions,
      missing current changelog entries and transformers downgrades.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_release_0_25_2_omn18595.py
          -q -k test_release_check_regressions
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC5

---
schema_version: 1.0.0
ticket_id: OMN-18595
title: omniintelligence 0.25.1 release by the scheduled release train
summary: >-
  The release train cuts omniintelligence 0.25.1 from dev: pyproject.toml and the uv.lock root entry declare
  0.25.1, CHANGELOG.md carries the v0.25.1 block, and the release-window test accepts any version at or
  above 0.25.0.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn18595-release-0-25-1
    statement: The repository declares version 0.25.1 in pyproject.toml, with a changelog block for it.
    acceptance:
      - id: AC1
        statement: 'AC1: pyproject.toml declares version 0.25.1 -- falsifier: rg -n ''^version = "0.25.1"$''
          pyproject.toml'
      - id: AC2
        statement: 'AC2: CHANGELOG.md has a v0.25.1 block -- falsifier: rg -n ''^## v0.25.1 '' CHANGELOG.md'
      - id: AC3
        statement: 'AC3: the release-window test accepts versions at or above 0.25.0 and passes at 0.25.1
          -- falsifier: uv run pytest tests/unit/test_release_0_25_0_omn21164.py -q'
evidence_requirements:
  - kind: tests
    description: Run the release-window test against the 0.25.1 version, lock and changelog.
    command: uv run pytest tests/unit/test_release_0_25_0_omn21164.py -q -n 0 --no-cov
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn18595-ac1-pyproject-version
    description: pyproject.toml declares version 0.25.1.
    source: manual
    checks:
      - check_type: command_succeeds
        check_value: rg -n '^version = "0.25.1"$' pyproject.toml
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn18595-ac2-changelog-block
    description: CHANGELOG.md carries the v0.25.1 block.
    source: manual
    checks:
      - check_type: command_succeeds
        check_value: rg -n '^## v0.25.1 ' CHANGELOG.md
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn18595-ac3-release-window-test
    description: The release-window test passes at version 0.25.1.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/test_release_0_25_0_omn21164.py -q -n 0 --no-cov
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3

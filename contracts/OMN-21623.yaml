---
schema_version: 1.0.0
ticket_id: OMN-21623
title: omniintelligence burn-down of the contracts_and_di findings, slice one -- the review pipeline's
  time budgets and codex search path move into a contract file
summary: >-
  The read-only contracts_and_di scan of omniintelligence src/ (omnibase_core dev, validator ValidatorContractsAndDi)
  reported 307 findings before this change and 295 after it. This slice removes 12 of them from review_pairing:
  ten literal_timeout findings (the served-model probe, the TCP probe and its retry delay, the codex exec
  budget, git show, two gh api reads, gh pr diff, the served-model resolver default, the voter probe)
  and two literal_path findings (the codex search directories). The values now sit in review_pairing/review_budgets.yaml,
  read through ModelReviewBudgets; a file missing a field, or naming an unknown one, fails to load. The
  checker work is the umbrella's own and is merged; this change is the omniintelligence burn-down. The
  read-only contracts_and_di scan of omniintelligence src/, pyproject.toml and .github (omnibase_core
  dev e3433152a, validator ValidatorContractsAndDi) reported 307 findings before this change and 295 after
  it. This slice removes 12 of them from src/omniintelligence/adapters, all literal_timeout: the HTTP,
  Postgres and Kafka handler defaults, the two Kafka flush budgets, the eval client timeout and retry
  delay, three Gmail intent calls and the Gemini and Z.AI plan-reviewer config defaults. The values now
  sit in adapters/adapter_settings.yaml, read through ModelAdapterSettings; a file missing a field, or
  naming an unknown one, fails to load. Model ids and endpoint URLs in the same files are left in place:
  the hardcoded-model-config and url-authority gates send them to the config-store overlay. The checker
  work is the umbrella's own and is merged; this change is the omniintelligence burn-down. A third slice
  removes 32 of the 124 literal_topic findings (the scan of src and scripts goes from 297 findings to
  265, nothing new): 14 topic constants leave constants.py, 12 members leave topics.py, the dead debug_intel/topics.py
  goes, and dispatch_handlers.py, the routing-feedback dispatch handler, the promotion scheduler and the
  runtime topic config read their topics through read_contract_topic, which resolves one topic from the
  node's contract.yaml event_bus section.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21623-budgets-contract
    statement: The review pipeline's time budgets and the codex search directories are declared in review_budgets.yaml,
      read from it by every consuming module, and every field is required.
    acceptance:
      - id: AC1
        statement: 'AC1: review_budgets.yaml declares the budgets and codex_fallback_dirs, each consuming
          module constant equals the contract value, and a file without one field fails to load -- falsifier:
          `uv run pytest tests/unit/review_pairing/test_review_timeouts_contract_omn21623.py -q` passes'
  - id: req-omn21623-adapter-settings-contract
    statement: The client adapters' timeout and retry budgets are declared in adapter_settings.yaml, read
      from it by every covered adapter, and every field is required.
    acceptance:
      - id: AC2
        statement: 'AC2: adapter_settings.yaml declares the timeout budgets, each adapter default reads
          the contract value, and a file without one field fails to load -- falsifier: `uv run pytest
          tests/unit/adapters/test_adapter_settings_contract_omn21623.py -q` passes'
  - id: req-omn21623-topics-from-contracts
    statement: Topics the runtime needs are read from the owning node's contract.yaml event_bus section
      through read_contract_topic, and a topic with no match or more than one distinct match fails the
      lookup instead of returning a guess.
    acceptance:
      - id: AC3
        statement: 'AC3: read_contract_topic returns the one topic a contract declares for a kind and
          event name and raises LookupError for none or two, and the dispatch route aliases it feeds still
          match the contracts'' subscribe topics -- falsifier: `uv run pytest tests/unit/runtime/test_contract_topics.py
          tests/unit/test_dispatch_parity.py -q -n 0` passes'
evidence_requirements:
  - kind: tests
    description: Contract tests for the required budget fields, codex_fallback_dirs and the module constants
      that read them, plus the existing review_pairing unit tests.
    command: uv run pytest tests/unit/review_pairing -q -n 0
  - kind: tests
    description: Contract tests for the required settings fields and the adapters that read them, plus
      the existing client and Gmail intent unit tests.
    command: uv run pytest tests/unit/adapters tests/unit/clients tests/unit/nodes/node_gmail_intent_evaluator_effect
      -q -n 0
  - kind: tests
    description: Lookup tests for read_contract_topic, the dispatch parity test over the contract-read
      aliases, and the unit tests of the changed runtime, bloom eval and topic sync modules.
    command: uv run pytest tests/unit/runtime tests/unit/test_dispatch_parity.py tests/unit/test_contract_topic_sync.py
      tests/unit/bloom_eval -q -n 0
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21623-ac1-budgets-contract
    description: The budgets contract tests pass, and no timeout or fallback-directory literal remains
      in the consuming modules.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/review_pairing/test_review_timeouts_contract_omn21623.py
          -q -n 0
        cwd: ${OMNI_HOME}/omniintelligence
      - check_type: command
        check_value: >-
          grep -q '^gh_api_seconds:' src/omniintelligence/review_pairing/review_budgets.yaml && grep -q
          '^codex_fallback_dirs:' src/omniintelligence/review_pairing/review_budgets.yaml && ! grep -nE
          '(timeout=(30|60)\b|"/opt/homebrew/bin")' src/omniintelligence/review_pairing/cli_review.py
          src/omniintelligence/review_pairing/adapters/adapter_codex_reviewer.py
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn21623-ac1-adapter-settings-contract
    description: The adapter settings contract tests pass, and no timeout literal remains in the adapter
      modules the settings cover.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/adapters/test_adapter_settings_contract_omn21623.py -q -n
          0
        cwd: ${OMNI_HOME}/omniintelligence
      - check_type: command
        check_value: >-
          grep -q '^http_timeout_s:' src/omniintelligence/adapters/adapter_settings.yaml && grep -q '^zai_timeout_s:'
          src/omniintelligence/adapters/adapter_settings.yaml && ! grep -nE '(DEFAULT_TIMEOUT = |DEFAULT_COMMAND_TIMEOUT
          = |DEFAULT_POLL_TIMEOUT = |_RETRY_BASE_DELAY = |_URL_FETCH_TIMEOUT_SECONDS: |_LLM_TIMEOUT_SECONDS:
          )' src/omniintelligence/adapters/adapter_http_rest.py src/omniintelligence/adapters/adapter_postgres.py
          src/omniintelligence/adapters/adapter_kafka.py src/omniintelligence/adapters/eval_llm_client.py
          src/omniintelligence/adapters/gmail_intent_http_client.py
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn21623-ac3-topics-from-contracts
    description: The lookup and parity tests pass, and the topic constants the slice moved are gone from
      constants.py and topics.py.
    source: manual
    checks:
      - check_type: test_passes
        check_value: uv run pytest tests/unit/runtime/test_contract_topics.py tests/unit/test_dispatch_parity.py
          -q -n 0
        cwd: ${OMNI_HOME}/omniintelligence
      - check_type: command
        check_value: >-
          grep -q 'class ModelContractTopicReader' src/omniintelligence/models/topics/model_contract_topic_reader.py
          && ! grep -nE '^(TOPIC_SUFFIX_TOOL_CONTENT_V1|TOPIC_CODE_FILE_DISCOVERED_V1|TOPIC_CODE_ENTITIES_EXTRACTED_V1)'
          src/omniintelligence/constants.py
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3

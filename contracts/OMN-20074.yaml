        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch"
        cwd: "${OMNI_HOME}/omniintelligence"
      - check_type: "test_passes"
        check_value: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k bare_call_with_no_secrets"

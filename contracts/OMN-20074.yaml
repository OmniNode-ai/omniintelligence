---
schema_version: "1.0.0"
ticket_id: "OMN-20074"
title: "Repo-owned DoD evidence caller for omniintelligence, S5 shadow count"
summary: "omniintelligence owns its DoD evidence contract and delegates verification to the receipt-gate
  reusable in caller-evidence mode, in shadow mode with the OCC difference step on, so every pull request
  records the new-path verdict beside OCC's verdict on the same head. No repo-evidence context is required
  and no OCC caller is removed. A focused test checks the base-branch caller wiring, the immutable pin,
  the shadow inputs and this contract."
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: "req-repo-evidence-gate"
    statement: |-
      omniintelligence must wire a base-branch caller evidence gate that runs beside OCC in shadow mode, and bind every repo-owned acceptance criterion to runnable test evidence.
    acceptance:
      - id: "AC1"
        statement: |-
          AC1: omniintelligence carries a caller workflow for the receipt-gate's caller-evidence mode that runs from the base branch (pull_request_target) on dev and main with read-only permissions and no secrets -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch
      - id: "AC2"
        statement: |-
          AC2: the caller pins the reusable by the full sha of the omnibase_core#1914 squash commit, the pin omnibase_core's own caller uses, with a verifier-version of 0.4.305 or later -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate
      - id: "AC3"
        statement: |-
          AC3: the caller sets evidence-source caller, shadow "true" and compare-with-occ "true", so the S5 shadow count records the new-path verdict beside OCC's on the same head and no repo-evidence check-run concludes anything but success -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k shadow_mode
      - id: "AC4"
        statement: |-
          AC4: the shadow caller removes no OCC caller: call-occ-autobind.yml and call-occ-companion-effect.yml stay until the S6 ruling -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k removes_no_occ_caller
      - id: "AC5"
        statement: |-
          AC5: every acceptance criterion of this contract names a falsifier that is also a dod_evidence check and runs an existing test file -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion
  - id: "req-precommit-hooks-from-core"
    statement: |-
      omniintelligence's no-hardcoded-topics and no-untracked-todos pre-commit hooks come from omnibase_core, which exports them under the same hook ids, instead of from onex_change_control, with every exclude and setting unchanged.
    acceptance:
      - id: "AC6"
        statement: |-
          AC6: .pre-commit-config.yaml declares no-hardcoded-topics and no-untracked-todos once each, in an omnibase_core block pinned to a full commit sha, with each exclude and setting unchanged and no onex_change_control block -- falsifier: uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q
      - id: "AC7"
        statement: |-
          AC7: omnibase_core's no-untracked-todos handler reproduces the printed output and exit code that onex_change_control's check-todo-format at rev 8d7e85bc00e7f1b1306d1cb40949be1ab6e7e91a recorded for 17 replayed cases -- falsifier: uv run pytest tests/ci/test_todo_format_replay_omn20074.py -q
  - id: "req-shadow-occ-context"
    statement: |-
      omniintelligence's S5 shadow must read OCC's verdict from a check-run this repository actually reports, so a run records a verdict instead of waiting out the lookup and reading not_compared.
    acceptance:
      - id: "AC8"
        statement: |-
          AC8: the caller passes occ-context equal to call-reject-skip-token / occ-preflight / eligibility, the nested name the reject-skip caller job reports, instead of the reusable's default occ-preflight / eligibility that this repository never reports -- falsifier: uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_context
  - id: "req-codeql-from-core"
    statement: |-
      omniintelligence's CodeQL caller uses omnibase_core's codeql-reusable.yml instead of onex_change_control's, with the job id, the inputs and the required context unchanged.
    acceptance:
      - id: "AC10"
        statement: |-
          AC10: security-scan.yml's codeql job calls OmniNode-ai/omnibase_core/.github/workflows/codeql-reusable.yml at the full sha 3fbb43eaff028a30edccb1b9b794e0a3f3d9523c and names no onex_change_control, and the job id, name and inputs are unchanged so the required context CodeQL / CodeQL Analysis (python) is unchanged -- falsifier: uv run pytest tests/ci/test_codeql_from_core_omn20074.py -q
evidence_requirements:
  - kind: "tests"
    description: "The caller workflow has the required base-branch trigger and read-only permissions."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k base_branch"
  - kind: "tests"
    description: "The caller pins the current receipt-gate by full sha."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k current_receipt_gate"
  - kind: "tests"
    description: "The caller runs in shadow mode and compares with OCC."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k shadow_mode"
  - kind: "tests"
    description: "The OCC callers stay."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k removes_no_occ_caller"
  - kind: "tests"
    description: "Every criterion of this contract is bound to a runnable check."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k falsifier_per_criterion"
  - kind: "tests"
    description: "Migrated hooks sit in an omnibase_core block at a full sha, excludes unchanged."
    command: "uv run pytest tests/ci/test_precommit_hooks_core_omn20074.py -q"
  - kind: "tests"
    description: "The omnibase_core todo-format handler replays the recorded change-control decisions."
    command: "uv run pytest tests/ci/test_todo_format_replay_omn20074.py -q"
  - kind: "tests"
    description: "The shadow's OCC lookup names a job this repository reports."
    command: "uv run pytest tests/ci/test_repo_evidence_caller_omn20074.py -q -k occ_context"
  - kind: "tests"
    description: "The CodeQL caller uses the omnibase_core reusable at a full sha, shape unchanged."
    command: "uv run pytest tests/ci/test_codeql_from_core_omn20074.py -q"
emergency_bypass:
  enabled: false
  justification: ""
  follow_up_ticket_id: ""

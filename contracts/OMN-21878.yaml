---
schema_version: 1.0.0
ticket_id: OMN-21878
title: Retain the transformers 5.10.1 floor across lock refreshes
summary: Require a unique transformers entry at or above 5.10.1, matching distribution URLs with sha256
  hashes, and an rl declaration that admits the actual locked version.
is_seam_ticket: false
interface_change: false
interfaces_touched: []
requirements:
  - id: req-omn21878-transformers-upgrade
    statement: The project resolves transformers at or above 5.10.1 with consistent artifacts.
    acceptance:
      - id: AC1
        statement: The unique transformers lock entry is at least 5.10.1 and its distribution URLs match
          the selected version.
      - id: AC2
        statement: Every transformers artifact carries a sha256 hash and names the selected version.
      - id: AC3
        statement: The rl lower bound admits the actual locked version.
      - id: AC4
        statement: The checks accept dependency upgrades and reject downgrades, mismatched artifacts,
          invalid hashes and a locked version below the declared floor.
evidence_requirements:
  - kind: tests
    description: Run the transformers lockfile assertions.
    command: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_transformers_lock_omn21878.py
      -q
emergency_bypass:
  enabled: false
  justification: ''
  follow_up_ticket_id: ''
dod_evidence:
  - id: dod-omn21878-ac1-lock-version
    description: The unique transformers lock entry is at least 5.10.1 and its distribution URLs match
      the selected version.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_transformers_lock_omn21878.py
          -q -k test_lock_selects_transformers_5_10_1
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC1
  - id: dod-omn21878-ac2-artifact-hashes
    description: Every transformers artifact carries a sha256 hash and names the selected version.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_transformers_lock_omn21878.py
          -q -k test_lock_transformers_artifacts_are_consistent
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC2
  - id: dod-omn21878-ac3-rl-group-floor
    description: The rl lower bound admits the actual locked version.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_transformers_lock_omn21878.py
          -q -k test_rl_group_declares_transformers
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC3
  - id: dod-omn21878-check-regressions
    description: The checks accept dependency upgrades and reject downgrades, mismatched artifacts, invalid
      hashes and a locked version below the declared floor.
    source: manual
    checks:
      - check_type: test_passes
        check_value: env PYTHONDONTWRITEBYTECODE=1 uv run pytest tests/unit/test_transformers_lock_omn21878.py
          -q -k test_transformers_check_regressions
        cwd: ${OMNI_HOME}/omniintelligence
    binds_ac:
      - AC4

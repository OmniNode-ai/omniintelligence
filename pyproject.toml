[dependency-groups]
# Development dependencies for linting and testing
# Versions aligned with [tool.poetry.group.dev.dependencies] for consistency
dev = [
    "mypy>=1.17.0",
    "types-PyYAML>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.5.0",
    "pytest-split>=0.10.0",
    "ruff>=0.12.5",
    "requests>=2.31.0",
    "factory-boy>=3.3.0",
    "tiktoken>=0.7.0",
    "pre-commit>=4.5.0",
    # Optional radon dependency included in dev for test coverage of radon code path
    "radon>=6.0.0",
    # Centralized governance hooks (OMN-5135)
    "onex-change-control>=0.1.0",
]

# Core node system dependencies
# Version constraints aligned with caret syntax:
#   ^0.20.0 = >=0.20.0,<0.21.0  (compatible releases within 0.20.x)
#   ^0.14.0 = >=0.14.0,<0.16.0  (relaxed to allow 0.15.x, see OMN-3549)
#   ^0.11.0 = >=0.11.0,<0.12.0  (compatible releases within 0.11.x)
core = [
    # ONEX private ecosystem dependencies (NOT on public PyPI)
    # Installed via editable installs from sibling repos or private registry.
    # Version bounds match Poetry caret syntax above.
    "omnibase-core>=0.46.3,<0.47.0",
    "omnibase-spi>=0.23.1,<0.24.0",
    "omnibase-infra>=0.38.4,<0.39.0",
    "omnimarket>=0.4.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    # Web framework for API endpoints
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.20",
    # Event bus (Kafka/Redpanda)
    "aiokafka>=0.11.0,<0.15.0",
    "confluent-kafka>=2.12.0,<3.0.0",
    # Vector database
    "qdrant-client>=1.15.1",
    # Graph database
    "neo4j>=5.28.2",
    # PostgreSQL
    "asyncpg>=0.29.0",
    # Document processing
    "pypdf2>=3.0.1",
    "pdfplumber>=0.11.6",
    "python-docx>=1.1.2",
    "markdown>=3.8",
    # AI/ML
    # NOTE (OMN-14176): torch / transformers / sentence-transformers moved to the
    # opt-in, non-default `rl` group below so the default install and the review
    # path (`uv sync --locked --all-extras`) install ZERO torch/nvidia. openai and
    # tiktoken stay here (no CUDA/torch pull).
    "openai>=1.71.0",
    "tiktoken>=0.5.0",
    # Utilities
    "tenacity>=8.2.0",
    "cachetools>=5.3.0",
    "redis[hiredis]>=5.0.0",
    # Logging and monitoring
    "logfire>=0.30.0",
    "structlog>=23.1.0",
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",
]

# RL training + adaptive intent backend — OPT-IN, NON-DEFAULT (OMN-14176).
# These are the only heavy CUDA/ML dependencies in the project. They are kept OUT
# of the default install and the review path (`uv sync --locked --all-extras`) so
# review CI installs zero torch/nvidia/triton. Restore with `uv sync --group rl`.
#   - torch / transformers / sentence-transformers: used only by
#     src/omniintelligence/rl/ (self-contained — no entry-point or runtime import)
#     and its tests. CUDA torch is left unpinned (>=2.0.0) so the 4090 GPU path is
#     recoverable with no lock surgery.
#   - adaptive-classifier: transitively pulls torch + transformers. It backs the
#     adaptive intent classifier, which is NOT on the node's runtime path (TF-IDF
#     is) — only its unit tests exercise it. Being a base dependency was the sole
#     reason torch reached the default/review install.
# Intentionally NOT composed into `all`: the 0-torch guarantee must hold on every
# default/review path. Run rl + adaptive tests explicitly with `--group rl`.
rl = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=4.1.0",
    "adaptive-classifier>=0.1.2",
]

# All dependencies for development and testing
# Uses include-group (PEP 735) to compose from core and dev groups
# This eliminates duplication and prevents version drift between groups
# NOTE (OMN-14176): `rl` is deliberately excluded — see the `rl` group comment.
all = [
    {include-group = "core"},
    {include-group = "dev"},
]

[tool.uv.sources]
onex-change-control = { git = "https://github.com/OmniNode-ai/onex_change_control.git", rev = "dd2620d18001495b8d0f493b421b38399e9aab4b" } # pragma: allowlist secret  # OMN-15129: was 4877d3c2 (2026-05-04), conflicted with nested pin from bumped omnimarket rev; aligned to the SHA omnimarket@54fa07dd already nests
# Release v0.24.0: pin to release tags
omnimarket = { git = "https://github.com/OmniNode-ai/omnimarket.git", rev = "54fa07dd0d46e7ba719a201a950626a041ad6433" } # pragma: allowlist secret  # OMN-15129: was tag v0.4.0 (nested compat pin git-tag v0.5.0 conflicted with omnibase-infra requiring compat==0.5.6); this rev (2026-07-10, earliest available) resolves compat==0.5.6 from PyPI (OMN-13878), matching # raw-override-ok: OMN-15145 pin is 217+ commits behind omnimarket dev as of the OMN-15144 staleness gate landing; refresh tracked in OMN-15145 (requires re-verifying nested compat/core resolution, out of scope for the gate PR itself)
# omnibase-core git-rev override removed under OMN-16287 (2026-08-20): the OMN-14758
# omnibase_infra override this comment cited was deleted 2026-08-01 (OMN-14628), and
# PyPI now has releases past the pinned unreleased rev — resolves from the declared
# range (>=0.46.3,<0.47.0) in [project.dependencies] instead.
# omnibase-infra git-rev override removed under OMN-15604 (2026-08-21): pinned rev
# ead076af5762be7777a42d52e3ed8668f2d0fa0d (v0.38.4-era, 2026-07-25) IS an ancestor
# of released v0.38.9 (`git merge-base --is-ancestor ead076af v0.38.9` = true) and is
# 346 files behind it — the override was blocking PyPI 0.38.9 for no live reason; the
# OMN-15145 "coupled infra/core/compat refresh" this cited is resolved by removing the
# override, not by keeping it. Resolves from the declared range (>=0.38.4,<0.39.0) in
# [project.dependencies] instead. This is also the concrete case OMN-15604 AC4 flags:
# a git-source override makes any omnibase-infra release-cascade bump a structural
# no-op until the override is removed by hand.

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = [
    # ==========================================================================
    # DESIGN CHOICES (intentionally ignored)
    # ==========================================================================
    "S101",      # Allow assert in tests
    "ISC001",    # Implicit string concat conflicts with formatter
    "COM812",    # Trailing comma conflicts with formatter

    # ==========================================================================
    # PRE-EXISTING TECHNICAL DEBT (suppress to unblock standardization)
    # Tracked for incremental cleanup in separate tickets.
    # ==========================================================================
    "E501",      # Line too long (pre-existing, 900+ violations)
    "E402",      # Imports not at top
    "B904",      # Raise without from in except
    "B019",      # lru_cache on methods
    "B007",      # Unused loop variable
    "B008",      # Function call defaults
    "N812",      # Lowercase imported as non-lowercase
    "N815",      # mixedCase variables
    "N806",      # Non-lowercase variable in function
    "N805",      # First arg not cls
    "UP042",     # (str, Enum) inheritance — 20 classes to migrate
    "SIM117",    # Nested with statements
    "SIM102",    # Nested if statements
    "SIM103",    # Explicit if/else returns
    "F841",      # Unused variables
    "ARG002",    # Unused method arguments
    "RUF012",    # Mutable class attrs should be ClassVar
    "RUF022",    # __all__ not sorted
    "BLE001",    # Blind exception catching
    "EM101",     # Exception string literal
    "EM102",     # Exception f-string
    "TRY003",    # Long exception messages
    "TRY300",    # Consider moving to else
    "TRY301",    # Abstract raise to inner function
    "TRY400",    # logging.exception instead of error
    "FBT001",    # Boolean positional arg
    "FBT002",    # Boolean default positional
    "ARG001",    # Unused function argument
    "SLF001",    # Private member access
    "C901",      # Function complexity
    "PLR0911",   # Too many return statements
    "PLR0912",   # Too many branches
    "PLR0913",   # Too many arguments
    "PLR0915",   # Too many statements
    "PLR2004",   # Magic values
    "RET504",    # Unnecessary assign before return
    "RET505",    # Unnecessary elif after return
    "ERA001",    # Commented-out code
    "PTH123",    # Use Path.open()
    "G004",      # Logging uses f-string
    "PGH003",    # Blanket type-ignore
    "S311",      # Random not suitable for crypto
    "T201",      # Print statements (enforced via per-file-ignores for CLIs)
    "INP001",    # Implicit namespace package
    "DTZ001",    # call-datetime-without-tzinfo
    "DTZ003",    # call-datetime-utcnow
    "A002",      # Function arg shadows builtin
    "S110",      # try-except-pass
    "TC003",     # Typing-only stdlib import
    "RUF005",    # Consider unpacking
    "PIE790",    # Unnecessary placeholder
    "TID252",    # Prefer absolute imports
    "PLC0415",   # Import outside top-level
    "UP017",     # datetime.UTC alias
    "RUF059",    # Unused unpacked variable
    "TC001",     # Typing-only first-party import (290+ violations)
    "TC002",     # Typing-only third-party import
    "TC005",     # Empty type-checking block
    "TC006",     # Runtime cast value
    "FBT003",    # Boolean positional value in call
    "PT018",     # Composite assertion in pytest
    "PT023",     # Incorrect mark parentheses
    "PT006",     # Parametrize names wrong type
    "PT001",     # Fixture parentheses style
    "PT012",     # Multiple statements in raises
    "PT017",     # Assert in except
    "PLW0108",   # Unnecessary lambda
    "PLW0603",   # Global statement
    "PLW1510",   # subprocess.run without check
    "PLW2901",   # Redefined loop name
    "TRY004",    # Prefer TypeError
    "TRY201",    # Verbose raise
    "S108",      # Hardcoded temp file
    "S310",      # Suspicious URL open
    "S607",      # Start process with partial path
    "S603",      # Subprocess without shell
    "S102",      # exec builtin
    "S104",      # Hardcoded bind all interfaces
    "S608",      # Hardcoded SQL
    "G201",      # Logging exc_info
    "TRY401",    # Verbose log message
    "DTZ005",    # datetime.now without tzinfo
    "DTZ007",    # strptime without zone
    "DTZ011",    # date.today
    "PTH100",    # os.path.abspath
    "PTH111",    # os.path.expanduser
    "PTH117",    # os.path.isabs
    "PTH120",    # os.path.dirname
    "PTH201",    # Path constructor current directory
    "PIE807",    # Reimplemented container builtin
    "PIE810",    # Multiple starts-ends-with
    "PLR1714",   # Repeated equality comparison
    "PLR5501",   # Collapsible else-if
    "PLC0207",   # Missing maxsplit arg
    "TRY203",    # Useless try-except
    "RUF100",    # Unused noqa
]

[tool.ruff.lint.per-file-ignores]
# AST visitor methods must use PascalCase (visit_Import, visit_Call, etc.)
"src/omniintelligence/audit/io_audit.py" = ["N802"]
"tests/unit/test_node_purity.py" = ["N802"]
# BaseHTTPRequestHandler requires do_GET method name
"src/omniintelligence/runtime/stub_launcher.py" = ["N802"]
# __init__.py files re-export for public API
"src/omniintelligence/validators/__init__.py" = ["F401"]
# Test intentionally catches broad exceptions for validation error testing
"tests/nodes/pattern_extraction_compute/test_handlers.py" = ["B017"]
# Test files — relaxed rules
"tests/**" = ["S101", "S603", "PLR2004", "SLF001", "PT011", "S105", "B017"]
"src/**/node_tests/**" = ["S101", "S603", "PLR2004", "SLF001", "PT011", "S105", "B017"]
# Scripts — may use print() and subprocess
"scripts/**" = ["T201", "S603", "S607", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["omniintelligence", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Third-party libraries without stubs — per-module overrides
[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "adaptive_classifier.*",
    "watchdog.*",
    "qdrant_client.*",
    "neo4j.*",
    "asyncpg.*",
    "tiktoken.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "cachetools.*",
    "tenacity.*",
    "logfire.*",
    "structlog.*",
    "prometheus_client.*",
    "psutil.*",
    "radon.*",
    "pydantic_settings.*",
    "omnibase_core.*",
    "omnibase_spi.*",
    "omnibase_infra.*",
    "pkg_resources",
]
ignore_missing_imports = true

# Modules not yet strict-ready — relax incrementally
[[tool.mypy.overrides]]
module = [
    "omniintelligence.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src/omniintelligence/nodes"]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "performance: marks tests as performance benchmarks",
    "unit: marks tests as unit tests",
    "audit: marks tests as I/O audit enforcement tests",
    "drift: marks tests for intent drift detection logic",
    "smoke: marks tests as pipeline health smoke tests (OBS-001, run every 5 min)",
    "forecast: marks tests for intent cost and latency forecasting logic",
    "baseline: marks tests for historical cost/latency baseline management",
    "intent_graph: marks tests for intent graph accumulation logic",
    "transition: marks tests for intent transition edge accumulation",
]

[tool.uv]
# Override transitive pins so our direct pins win.
override-dependencies = [
    "omnibase-core>=0.46.3,<0.47.0",
    "omnibase-spi>=0.23.1,<0.24.0",
    "omnibase-infra>=0.38.4,<0.39.0",
    # OMN-15129: freeze ruff at the pre-existing dev-HEAD version. The unrelated
    # infra/core/compat pin refresh in this PR forced a full uv.lock re-resolve,
    # which floated ruff 0.15.8 -> 0.16.0 (unpinned lower-bound-only constraint)
    # and surfaced ~110 new PLR0917-class lint findings in pre-existing test code
    # that are out of scope for this dependency-pin fix.
    "ruff==0.15.8",
]

---
# Timeout and poll budgets of the runtime, the code projection, the node defaults
# and the contract linter, in seconds (OMN-21623).
#
# Code holds none of these values: every consumer reads them from here through
# ModelRuntimeTimeouts, and a file that omits a field, or names one the model
# does not know, fails to load rather than falling back to a value in code.
# A caller that needs a different value injects it through the consumer's own
# argument or config; this file is the default when it does not.

# code_projection: AsyncQdrantClient request timeout (live projection and live
# context search).
qdrant_request_s: 30.0

# code_projection: embedding client request timeout, shared by the live projection
# and the live context search (the retry delay is the client config's own default).
embedding_request_s: 60.0

# code_projection: asyncpg command timeout of the live projection pool.
projection_pg_command_s: 30.0

# node_navigation_retriever_effect: retrieval wait when the input names none.
navigation_retrieve_s: 2.0

# node_pattern_assembler_orchestrator: workflow timeout when the caller names none.
pattern_assembly_workflow_s: 120.0

# node_pattern_matching_compute: per-pattern regex execution budget (ReDoS guard).
regex_match_s: 2.0

# node_watchdog_effect: polling interval of the fallback observer.
watchdog_poll_s: 5.0

# runtime dispatch_handler_pattern_learning: session enrichment DB query.
session_query_s: 2.0

# validators contract_linter: --watch poll interval.
contract_linter_watch_poll_s: 1.0

# adapters utilization_llm_client: chat-completion HTTP client timeout.
utilization_llm_s: 30.0

# review_bot github client_github: GitHub REST request timeout (GET, POST, DELETE).
github_api_s: 10.0

# runtime dispatch_handler_code_embed_graph: embedding endpoint request timeout.
code_embed_s: 30.0

# runtime dispatch_handlers: minimum gap between pattern-stored projection snapshots.
projection_throttle_s: 60.0

# runtime introspection: heartbeat publish interval.
heartbeat_s: 30.0

# runtime promotion_scheduler: promotion check interval when the caller names none.
promotion_interval_s: 300.0

# runtime stub_launcher: wait for the health server thread to stop at shutdown.
health_shutdown_s: 5.0

# node_intent_cost_forecast_compute: widest confidence interval the forecast reports,
# scaled by (1 - classification confidence).
forecast_max_ci_width: 0.8

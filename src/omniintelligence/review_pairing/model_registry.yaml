---
# Hostile-reviewer model registry
#
# Declarative endpoint configuration for the adversarial review adapter
# (`adapter_ai_reviewer.py`). Replaces the previously hardcoded
# `MODEL_REGISTRY: dict[str, ModelEndpointConfig]` literal.
#
# Schema (one entry per model key):
#   env_var:          Environment variable that overrides default_url at runtime.
#   default_url:      Fallback URL when env_var is unset. Empty string allowed;
#                     an empty resolved URL raises at call time.
#   kind:             Capability tag (reasoning, long_context, fast_review,
#                     code_review, api_fallback). Consumed as a plain string
#                     by adapter_ai_reviewer.
#   timeout_seconds:  HTTP request timeout (float).
#   api_model_id:     Wire-level model identifier sent in the chat-completion
#                     payload. Empty for CLI-only models.
#   enable_thinking:  Optional bool (default true). Whether the model may emit
#                     a reasoning preamble before its answer (Qwen3
#                     chat_template_kwargs.enable_thinking). call_model()
#                     reads this per-model and passes it through --
#                     flipping reasoning on/off is a config edit here, not a
#                     code change.
#
# Reference: OMN-7213

default_model_key: "deepseek-r1"

local_model_keys:
  - "deepseek-r1"
  - "qwen3-review"
  - "qwen3-review-b"
  - "qwen3-coder"
  - "qwen3-14b"
  - "qwen3-next"

api_fallback_keys:
  - "codex"

models:
  # deepseek-r1 — REPOINTED (OMN-16407 residual, 2026-08-23) from the now-
  # physically-removed RTX 4090 (.201:8001, GPU1 sent for RMA at the
  # 2026-08-23 ~13:00Z reboot) to the same SGLang endpoint qwen3-review /
  # qwen3-review-b use (.201:8000, "qwen3.8" / Qwen3.8-27B NVFP4). This key
  # is both default_model_key and a member of local_model_keys below, so
  # deletion is NOT safe: model_registry_loader._validate_cross_refs raises
  # ModelRegistryLoadError (hard import-time failure) if default_model_key
  # names a key absent from `models`. enable_thinking:false carried over
  # from the identical qwen3-review-b migration (OMN-14176): without it, a
  # thinking-model response against this endpoint can consume the whole
  # max_tokens budget on a <think> preamble and defeat naive
  # strip-think-tags parsing.
  deepseek-r1:
    env_var: "LLM_DEEPSEEK_R1_URL"
    default_url: "http://192.168.86.201:8000"  # onex-allow-internal-ip
    kind: "reasoning"
    timeout_seconds: 300.0
    api_model_id: "qwen3.8"
    enable_thinking: false

  # qwen3-review — live .201:8000 endpoint. UPDATED (OMN-16407, 2026-08-23):
  # .201 was rebooted ~13:00Z 2026-08-23 and GPU1 (the RTX 4090 that served
  # qwen3-review-b below) was physically REMOVED from the host for RMA. The
  # host's OTHER GPU (the RTX 5090 on this same :8000 port) also changed
  # backend at the same reboot: the old vLLM Qwen3.6-35B-A3B process is gone,
  # replaced by an SGLang + DSpark-drafter stack serving "qwen3.8"
  # (Qwen3.8-27B NVFP4, ~131 tok/s measured decode -- see qwen3-review-b's
  # comment below for the live measurement). api_model_id updated to match
  # (live-verified via `curl :8000/v1/models`). NOTE: unlike the vLLM
  # generation this replaced, SGLang on this endpoint does NOT reject a
  # mismatched `model` field in the request (confirmed live: a
  # deliberately-wrong id got a 200 response echoing the wrong id back) --
  # api_model_id is still kept exact for observability/logging, not because
  # the server enforces it.
  # enable_thinking: false (OMN-14176) -- without a reasoning scratchpad,
  # a thinking-model response can consume the whole max_tokens budget on a
  # <think> preamble before producing an answer, and (observed live) can
  # emit only a trailing </think> with no matching opener, which defeats
  # naive strip-think-tags parsing. Live-confirmed: suppresses the preamble
  # entirely, response is a clean directly-parseable JSON array.
  qwen3-review:
    env_var: "LLM_QWEN3_REVIEW_URL"
    default_url: "http://192.168.86.201:8000"  # onex-allow-internal-ip
    kind: "code_review"
    timeout_seconds: 120.0
    api_model_id: "qwen3.8"
    enable_thinking: false

  # qwen3-review-b — REPOINTED (OMN-16407, 2026-08-23) from the now-physically-
  # removed RTX 4090 (.201:8001, llama-server, GPU1 sent for RMA at the
  # 2026-08-23 ~13:00Z reboot) to the same SGLang endpoint qwen3-review now
  # uses (.201:8000, "qwen3.8" / Qwen3.8-27B NVFP4). The fleet currently has
  # exactly one GPU-backed review-capable LLM (the RTX 5090); qwen3-review and
  # qwen3-review-b are therefore two independent HTTP calls to the same
  # physical model until a second local backend exists again -- this still
  # satisfies cli_review's "2/2 models responded" gate mechanically, but the
  # two reviews are no longer architecturally independent. Tracked as a
  # residual under OMN-16407; not fixed here (no second GPU-backed endpoint
  # exists on the fleet to route to instead).
  #
  # timeout_seconds lowered 1200 -> 300 (OMN-16407): the prior 1200s was sized
  # against the removed 4090/llama-server's measured 4.3-4.6 tok/s. Live-
  # measured against the new SGLang :8000 endpoint this session: a
  # realistic-sized review payload (37,230 prompt tokens, 3,694 completion
  # tokens, finish_reason=stop i.e. not truncated) completed in 34.7s
  # wall-clock end-to-end -- consistent with the ~131 tok/s decode throughput
  # the fleet reports for this endpoint. 300s keeps ~8.6x margin over that
  # measured worst case for network/queueing/contention variance without
  # carrying forward a timeout sized for hardware that no longer exists.
  #
  # max_retries stays at 1 (2 total attempts, unchanged from OMN-15115): the
  # rationale (a doomed retry against a systematically-slow endpoint burns
  # wall-clock for the same outcome) still applies; nothing about the retry
  # count depended on the removed hardware specifically.
  #
  # Worst-case sequential budget with these values: qwen3-review (unchanged,
  # ~500s) + qwen3-review-b (2 x 300s = 600s) = ~1100s, well within the 3600s
  # (60min) hostile-review job ceiling. See omniintelligence.review_pairing
  # .retry_budget, which asserts this on every hostile-review CI run against
  # the LIVE registry + LIVE per-model overrides.
  qwen3-review-b:
    env_var: "LLM_QWEN3_REVIEW_B_URL"
    default_url: "http://192.168.86.201:8000"  # onex-allow-internal-ip
    kind: "code_review"
    timeout_seconds: 300.0
    api_model_id: "qwen3.8"
    enable_thinking: false
    max_retries: 1

  # glm-review — authenticated CLOUD reviewer on the z.ai GLM Coding Plan
  # (OMN-17492). Deliberately NOT in local_model_keys: it is not TCP-probed
  # as a LAN endpoint and never participates in the local-reachability
  # fallback — it passes through select_models_with_fallback as a non-local
  # key, so it still runs when every local model is down (that independence
  # is the point: OMN-16481 flagged that qwen3-review and qwen3-review-b
  # both resolve to the ONE remaining GPU, and OMN-17193 sub-row 2 wants the
  # reviewer leg on an independent, funded quota domain).
  #
  # Endpoint authority is the OMN-6790 contract
  # (omnimarket bifrost_delegation.yaml backend cloud-glm): the Coding-Plan
  # surface /api/coding/paas/v4 — NEVER /api/paas/v4, which answers a
  # Coding-Plan key with 429 code 1113 ("Insufficient balance") that reads
  # as billing but means WRONG ENDPOINT. default_url is the COMPLETE
  # chat-completions URL (ends in /chat/completions), which call_model uses
  # verbatim instead of appending /v1/chat/completions.
  # tests/unit/review_pairing/test_model_registry_loader.py pins the
  # coding-plan prefix, mirroring test_glm_coding_plan_endpoint_omn6790.py.
  #
  # api_key_env: the Bearer key env var (GitHub Actions secret in CI, from
  # the platform secret store). Fail-closed per-model when unset — the rest
  # of the roster still reviews. api_model_id glm-5.3-flash = the cheapest
  # id served on the plan (live probe 2026-08-30, OMN-6790).
  # enable_thinking false ⇒ the z.ai wire shape thinking:{type: disabled}
  # (call_model maps the shared declarative toggle to the GLM spelling).
  # timeout 300s x (1 + max_retries 1) keeps the roster's sequential
  # worst-case within the 35-minute hostile-review job ceiling (see
  # retry_budget.py).
  glm-review:
    env_var: "LLM_GLM_REVIEW_URL"
    default_url: "https://api.z.ai/api/coding/paas/v4/chat/completions"
    kind: "code_review"
    timeout_seconds: 300.0
    api_model_id: "glm-5.3-flash"
    enable_thinking: false
    max_retries: 1
    api_key_env: "LLM_GLM_API_KEY"  # pragma: allowlist secret

  qwen3-coder:
    env_var: "LLM_CODER_URL"
    default_url: ""
    kind: "long_context"
    timeout_seconds: 120.0
    api_model_id: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"

  qwen3-14b:
    env_var: "LLM_CODER_FAST_URL"
    default_url: ""
    kind: "fast_review"
    timeout_seconds: 60.0
    api_model_id: "Qwen/Qwen3-14B-AWQ"

  qwen3-next:
    env_var: "LLM_QWEN3_NEXT_URL"
    default_url: ""
    kind: "code_review"
    timeout_seconds: 120.0
    api_model_id: "Qwen3-Next-80B-A3B"

  codex:
    env_var: "CODEX_BINARY"
    default_url: ""
    kind: "cli_fallback"
    timeout_seconds: 180.0
    api_model_id: "codex"

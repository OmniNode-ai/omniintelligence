---
# Hostile-reviewer model registry
#
# Declarative endpoint configuration for the adversarial review adapter
# (`adapter_ai_reviewer.py`). Replaces the previously hardcoded
# `MODEL_REGISTRY: dict[str, ModelEndpointConfig]` literal.
#
# Schema (one entry per model key):
#   env_var:          Environment variable that overrides default_url at runtime.
#   default_url:      Fallback URL when env_var is unset. Empty string allowed;
#                     an empty resolved URL raises at call time.
#   kind:             Capability tag (reasoning, long_context, fast_review,
#                     code_review, api_fallback). Consumed as a plain string
#                     by adapter_ai_reviewer.
#   timeout_seconds:  HTTP request timeout (float).
#   api_model_id:     Wire-level model identifier sent in the chat-completion
#                     payload. Empty for CLI-only models AND for every entry
#                     whose model_id_source is "served".
#   model_id_source:  "declared" (default) sends api_model_id. "served"
#                     resolves the id at call time from this endpoint's
#                     /v1/models (OMN-18623). Declaring both is refused at
#                     load time. Use "served" for a single-model self-hosted
#                     endpoint, where the served model is a fact this repo
#                     observes rather than owns; use "declared" for a
#                     multi-model cloud endpoint, where the id is a real
#                     choice this repo makes.
#   constrain_findings_schema:
#                     Optional bool (default false). Sends a response_format
#                     json_schema for the findings array so decoding is
#                     constrained to it (OMN-20422). For a model that ignores
#                     the prompt's "raw JSON array" instruction.
#   enable_thinking:  Optional bool (default true). Whether the model may emit
#                     a reasoning preamble before its answer (Qwen3
#                     chat_template_kwargs.enable_thinking). call_model()
#                     reads this per-model and passes it through --
#                     flipping reasoning on/off is a config edit here, not a
#                     code change.
#
# Reference: OMN-7213

# DELETED (OMN-17492, 2026-09-25): deepseek-r1 and qwen3-review-b, two
# further names for the one model qwen3-review already names (.201:8000,
# Qwen3.8-27B), and glm-review, a third-party cloud reviewer. A second name
# for one model let the two-model quorum be one model agreeing with itself;
# the quorum now counts distinct endpoint+model identities
# (reviewer_identity.py), and
# tests/unit/review_pairing/test_quorum_distinct_reviewers_omn17492.py
# refuses any two keys here that resolve to one reviewer. Private diffs go
# only to lab models (operator ruling 2026-09-25), so no cloud reviewer is
# registered.
default_model_key: "qwen3-review"

# Cross-model agreement policy (OMN-18479).
#
# A finding blocks a review only when at least `min_agreeing_models`
# DISTINCT successful models raise a matching finding; anything raised by
# fewer is reported as a warning, never dropped and never blocking. Fewer
# than `min_agreeing_models` SUCCESSFUL models is not a verdict at all --
# the CLI exits 2 (degraded quorum) and every caller fails closed on it.
#
# `min_agreeing_models` is bounded at >= 2 by the Pydantic contract
# (ModelReviewQuorumPolicy), so neither this file nor a caller's
# --quorum-threshold can lower it to one and restore single-model
# blocking. A caller may RAISE it for its own repository.
review_quorum:
  min_agreeing_models: 2
  line_proximity_lines: 3
  blocking_severities:
    - "critical"
    - "error"

local_model_keys:
  - "qwen3-review"
  - "local-studio-planner"
  - "qwen3-coder"
  - "qwen3-14b"
  - "qwen3-next"

api_fallback_keys:
  - "codex"

models:
  # qwen3-review — live .201:8000 endpoint. UPDATED (OMN-16407, 2026-08-23):
  # .201 was rebooted ~13:00Z 2026-08-23 and GPU1 (the RTX 4090 that served
  # the since-deleted qwen3-review-b) was physically REMOVED from the host for RMA. The
  # host's OTHER GPU (the RTX 5090 on this same :8000 port) also changed
  # backend at the same reboot: the old vLLM Qwen3.6-35B-A3B process is gone,
  # replaced by an SGLang + DSpark-drafter stack serving "qwen3.8"
  # (Qwen3.8-27B NVFP4, ~131 tok/s measured decode, measured under the
  # since-deleted qwen3-review-b entry). api_model_id updated to match
  # (live-verified via `curl :8000/v1/models`). NOTE: unlike the vLLM
  # generation this replaced, SGLang on this endpoint does NOT reject a
  # mismatched `model` field in the request (confirmed live: a
  # deliberately-wrong id got a 200 response echoing the wrong id back) --
  # api_model_id is still kept exact for observability/logging, not because
  # the server enforces it.
  # enable_thinking: false (OMN-14176) -- without a reasoning scratchpad,
  # a thinking-model response can consume the whole max_tokens budget on a
  # <think> preamble before producing an answer, and (observed live) can
  # emit only a trailing </think> with no matching opener, which defeats
  # naive strip-think-tags parsing. Live-confirmed: suppresses the preamble
  # entirely, response is a clean directly-parseable JSON array.
  # NO MODEL ID IS DECLARED HERE, DELIBERATELY (OMN-18623, 2026-09-17).
  # Operator ruling, in-session 2026-09-17T19:54:09Z, firm: the hostile
  # reviewer's model must not be hardcoded to a specific model id; a
  # served-model change must be solvable by an overlay or runtime resolution,
  # never by a pull request that repoints a literal.
  # The field was repointed THREE times in four weeks -- OMN-16407
  # ("qwen3.8"), OMN-17786 ("Qwen3.6-35B-A3B"), OMN-18623 ("Qwen3.8-27B") --
  # because the model this host serves is decided by a systemd unit on the
  # host, not by this repository. A declared id is a COPY of a fact owned
  # elsewhere, and every copy went stale the moment the unit changed, taking
  # the Hostile Review Gate down in every consuming repo until a human landed
  # a pull request hours later.
  # `model_id_source: served` reads the fact instead: the id is resolved at
  # call time from this endpoint's /v1/models (served_model_resolver.py),
  # which is exact because vLLM serves exactly one model per port and
  # validates the `model` field. After this, a served-model swap needs no edit
  # in any repository. Resolution is fail-closed -- unreachable, unparseable,
  # zero models or MORE than one all refuse rather than guess.
  # AN OVERLAY WAS CONSIDERED AND NOT TAKEN: it is still a file a human edits
  # when the served model changes, which is the same shape as the literal,
  # only relocated. It stays the right mechanism for a value this repo OWNS,
  # which is why the cloud reviewer below keeps `declared`.
  qwen3-review:
    env_var: "LLM_QWEN3_REVIEW_URL"
    default_url: "http://192.168.86.201:8000"  # onex-allow-internal-ip
    kind: "code_review"
    timeout_seconds: 120.0
    model_id_source: "served"
    enable_thinking: false
    # OMN-20422: the two lab voters serve the same Qwen3.8-27B weights, so with
    # identical sampling and an identical prompt their "agreement" is one model
    # agreeing with itself. This voter keeps the sampling it has always had
    # (temperature 0.3, the server's own top_p) and reads for correctness.
    temperature: 0.3
    review_focus: "Give extra scrutiny to correctness: logic errors, off-by-one and boundary conditions,
      wrong or missing error handling, state that is read before it is written, and tests that would pass
      whether or not the change worked. Keep reviewing the whole change for every other defect as well;
      this is added emphasis, not a narrower remit. Label each finding with the category that best describes
      the defect itself."

  # local-studio-planner -- ADDED as gpt-oss-review (OMN-17492, 2026-09-25)
  # under the operator ruling of 2026-09-25T12:40Z (ledger RULING, "we have
  # gpt oss 120 on this machine, why don't we use it as a review model?"), and
  # renamed local-studio-planner by OMN-17427 (2026-10-08). The first local
  # reviewer that is a DIFFERENT MODEL from the one behind qwen3-review:
  # qwen3-review, qwen3-review-b and deepseek-r1 all resolved to .201:8000,
  # which serves one model (Qwen3.8-27B), so any two of them agreeing was one
  # model agreeing with itself (the two aliases are now deleted).
  # THE KEY NAMES THE RUNG, NOT THE MODEL. It is the backend id the routing
  # overlay uses for this endpoint (omnibase_infra docker/lane-overlays/
  # dev.bifrost.yaml), so the next swap of the model behind :8130 needs no
  # rename here, in the consuming workflows, or in their pins. A key spelled
  # with a model-family name is also refused by the hardcoded-model-config
  # guard (family M) in a SOURCE file.
  # Endpoint: the Mac Studio (.200) llama.cpp server on :8130, supervised by
  # the user LaunchAgent ai.omninode.planner-studio, with a 262,144-token
  # context shared by 4 parallel slots (reference/lab-hosts-and-lanes.md in
  # knowledge-base-internal). Since 2026-10-08 it serves Qwen3.6-35B-A3B (Q8_0, alias
  # qwen3.6-35b-a3b; operator RULING 2026-10-08T17:38:56Z); before that it
  # served gpt-oss-120b MXFP4 under the LaunchAgent planner-gptoss120b.
  # Keyless, LAN-only; the .201 runner containers reach it. The host is
  # always on (operator, 2026-09-25). If it is ever unreachable, the
  # reachability probe drops it and names it in the result; with the
  # two-model lab roster that leaves one reviewer, which is a degraded
  # quorum, and every calling workflow fails closed on it.
  # model_id_source: served, per the OMN-18623 ruling that no local reviewer
  # declares a model id.
  # timeout_seconds, max_retries and reasoning_effort below were measured on
  # gpt-oss-120b (OMN-17492) and have not been re-measured on Qwen3.6-35B-A3B.
  # reasoning_effort in particular is read from chat_template_kwargs by the
  # gpt-oss chat template; the template now served on :8130 does not contain
  # the string reasoning_effort (GET /props, chat_template, 2026-10-08), so the
  # value is sent and not read. It is left in place because dropping it is a
  # change of request shape this rename does not measure.
  local-studio-planner:
    env_var: "LLM_LOCAL_STUDIO_PLANNER_URL"
    default_url: "http://192.168.86.200:8130"  # onex-allow-internal-ip
    kind: "code_review"
    timeout_seconds: 300.0
    model_id_source: "served"
    enable_thinking: false
    reasoning_effort: "medium"
    max_retries: 1
    # OMN-20422: Qwen3.6-35B-A3B ignores the prompt's "raw JSON array"
    # instruction and answers with several bare JSON objects in a row, which is
    # not JSON. Measured on omnibase_infra#4757's diff (2026-10-09, .200:8131):
    # 7 of 12 replies parsed without this, 12 of 12 with it.
    constrain_findings_schema: true
    # OMN-20422: different sampling and a different emphasis from qwen3-review,
    # so that when the two voters serve the same weights they can still
    # disagree where a change is genuinely in doubt. Nucleus values follow the
    # Qwen3 non-thinking card (temperature 0.7, top_p 0.8).
    temperature: 0.7
    top_p: 0.8
    review_focus: "Give extra scrutiny to security and contracts: untrusted input reaching a shell, query,
      path or template; secrets, tokens or credentials in code, logs or workflow files; permissions and
      trust boundaries; and any change to a public interface, schema, event shape or workflow contract
      that a caller depends on without the callers being updated. Keep reviewing the whole change for
      every other defect as well; this is added emphasis, not a narrower remit. Label each finding with
      the category that best describes the defect itself."

  qwen3-coder:
    env_var: "LLM_CODER_URL"
    default_url: ""
    kind: "long_context"
    timeout_seconds: 120.0
    api_model_id: "cyankiwi/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit"

  qwen3-14b:
    env_var: "LLM_CODER_FAST_URL"
    default_url: ""
    kind: "fast_review"
    timeout_seconds: 60.0
    api_model_id: "Qwen/Qwen3-14B-AWQ"

  qwen3-next:
    env_var: "LLM_QWEN3_NEXT_URL"
    default_url: ""
    kind: "code_review"
    timeout_seconds: 120.0
    api_model_id: "Qwen3-Next-80B-A3B"

  codex:
    env_var: "CODEX_BINARY"
    default_url: ""
    kind: "cli_fallback"
    timeout_seconds: 180.0
    api_model_id: "codex"

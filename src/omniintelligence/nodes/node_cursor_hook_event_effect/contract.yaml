# SPDX-License-Identifier: MIT
# Copyright (c) 2025 OmniNode Team
#
# ONEX Node Contract
# Node: NodeCursorHookEventEffect
#
# Dedicated Effect node for Cursor IDE hook events emitted by the OmniCursor
# plugin. Cursor is a first-class peer to Claude Code: it consumes its own
# cursor-hook-event.v1 topic with its own ModelCursorHookEvent input, so Cursor
# events are processed as Cursor events (not Claude events). Processing reuses
# the shared intelligence pipeline via event-type translation to keep the two
# dispatchers interchangeable.

# Contract identifiers
name: "node_cursor_hook_event_effect"
version: "1.0.0"
contract_name: "node_cursor_hook_event_effect"
node_name: "node_cursor_hook_event_effect"
contract_version: {major: 1, minor: 0, patch: 0}
node_version:
  major: 1
  minor: 0
  patch: 0

# Node type
node_type: "EFFECT_GENERIC"
runtime_profiles: ["effects"]

# Description
description: >
  Dedicated Effect node for handling Cursor IDE hook events. Receives events from
  beforeSubmitPrompt, afterFileEdit, beforeShellExecution, and stop hooks. For
  beforeSubmitPrompt, routes to intent classification and emits classified intents
  to Kafka. For stop, emits a pattern learning command. Processing is reused from
  the shared pipeline (node_claude_hook_event_effect) via event-type translation.

# Strongly typed I/O models
input_model:
  name: "ModelCursorHookEvent"
  module: "omniintelligence.nodes.node_cursor_hook_event_effect.models"
  description: "Unified input model for all Cursor IDE hook events."
output_model:
  name: "ModelClaudeHookResult"
  module: "omniintelligence.nodes.node_cursor_hook_event_effect.models"
  description: "Platform-neutral output model with processing status and intent results."

# =============================================================================
# HANDLER ROUTING (Event Type Based Dispatch)
# =============================================================================
handler_routing:
  routing_strategy: "event_type_match"
  entry_point:
    function: "route_cursor_hook_event"
    module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
    type: "async"
    description: "Main entry point that translates Cursor events and delegates to the shared pipeline"
  handlers:
    # beforeSubmitPrompt - Intent Classification (Cursor equivalent of UserPromptSubmit)
    - event_type: "beforeSubmitPrompt"
      handler:
        function: "route_cursor_hook_event"
        module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
        type: "async"
      description: "Classify user prompt intent"
      actions:
        - "translate to canonical event"
        - "call node_intent_classifier_compute"
        - "emit to Kafka"

    # stop - Trigger pattern extraction (Cursor equivalent of Stop)
    - event_type: "stop"
      handler:
        function: "route_cursor_hook_event"
        module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
        type: "async"
      description: "Stop event triggers pattern learning command emission"
      actions:
        - "emit onex.cmd.omniintelligence.pattern-learning.v1 to Kafka"

    # afterFileEdit - tool-use handling (Cursor equivalent of PostToolUse)
    - event_type: "afterFileEdit"
      handler:
        function: "route_cursor_hook_event"
        module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
        type: "async"
      description: "File edit applied (tool-use persistence / no-op)"

    # beforeShellExecution - guard (Cursor equivalent of PreToolUse)
    - event_type: "beforeShellExecution"
      handler:
        function: "route_cursor_hook_event"
        module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
        type: "async"
      description: "Shell command guard (no-op, future: tool validation)"

  # Default handler for unrecognized event types
  default_handler:
    function: "route_cursor_hook_event"
    module: "omniintelligence.nodes.node_cursor_hook_event_effect.handlers.handler_cursor_event"
    type: "async"
    description: "Default handler routes through the shared pipeline (no-op for unmapped types)"

# =============================================================================
# IO OPERATIONS
# =============================================================================
io_operations:
  - operation: "process_cursor_hook_event"
    description: "Process a Cursor IDE hook event and route to the shared pipeline"
    input_fields:
      - event_type
      - session_id
      - correlation_id
      - timestamp_utc
      - payload
    output_fields:
      - status
      - event_type
      - session_id
      - correlation_id
      - intent_result
      - processing_time_ms
      - processed_at
      - error_message
      - metadata

# =============================================================================
# PUBLISHED EVENTS (Kafka) - Documentation Layer
# =============================================================================
published_events:
  - topic_suffix: "onex.cmd.omniintelligence.pattern-learning.v1"
    full_topic_pattern: "onex.cmd.omniintelligence.pattern-learning.v1"
    event_type: "PatternLearningRequested"
    trigger: "stop event processed (session completed)"
    description: "Emitted when a Cursor session stops to trigger pattern extraction."
    payload_fields:
      - name: "session_id"
        type: "string"
        description: "Session ID from the hook event"
      - name: "correlation_id"
        type: "string"
        description: "Correlation ID for distributed tracing"

  - topic_suffix: "onex.evt.omniintelligence.intent-classified.v1"
    full_topic_pattern: "onex.evt.omniintelligence.intent-classified.v1"
    event_type: "IntentClassified"
    trigger: "beforeSubmitPrompt processed successfully"
    description: "Emitted when a Cursor user prompt intent is successfully classified."
    payload_fields:
      - name: "session_id"
        type: "string"
        description: "Session ID from the hook event"
      - name: "intent_category"
        type: "string"
        description: "Classified intent category"

# =============================================================================
# EVENT BUS SUBCONTRACT - Runtime Routing Layer
# =============================================================================
event_bus:
  version:
    major: 1
    minor: 0
    patch: 0

  # Topics this node subscribes to (receives events from)
  subscribe_topics:
    - "onex.cmd.omniintelligence.cursor-hook-event.v1"

  # Topics this node publishes to (sends events to)
  publish_topics:
    - "onex.evt.omniintelligence.intent-classified.v1"
    - "onex.cmd.omniintelligence.pattern-learning.v1"

  # Metadata for subscribed topics
  subscribe_topic_metadata:
    "onex.cmd.omniintelligence.cursor-hook-event.v1":
      schema_ref: "omniintelligence.nodes.node_cursor_hook_event_effect.models.ModelCursorHookEvent"
      description: "Cursor IDE hook events from the OmniCursor plugin (beforeSubmitPrompt,
        afterFileEdit, beforeShellExecution, stop)."
      # Cross-repo topic: published by OmniCursor hooks via the omnimarket emit
      # daemon (config/event_registry/omnicursor.yaml, prompt.submitted fan-out).
      external_publisher:
        repo: "OmniCursor"
        module: "omnicursor.hooks"
        topic_constant: "cursor-hook-event.v1"

  # Metadata for published topics
  publish_topic_metadata:
    "onex.evt.omniintelligence.intent-classified.v1":
      schema_ref: "omniintelligence.nodes.node_cursor_hook_event_effect.models.ModelClaudeHookResult"
      description: "Classified intent results from beforeSubmitPrompt processing"
    "onex.cmd.omniintelligence.pattern-learning.v1":
      schema_ref: "omniintelligence.nodes.node_claude_hook_event_effect.models.ModelPatternLearningCommand"
      description: "Pattern learning command emitted on stop event to trigger pattern extraction"

# =============================================================================
# DEPENDENCIES
# =============================================================================
dependencies:
  - name: "node_claude_hook_event_effect"
    type: "node"
    node_name: "node_claude_hook_event_effect"
    module: "omniintelligence.nodes.node_claude_hook_event_effect"
    description: "Shared intelligence pipeline reused via event-type translation"
    required: true

  - name: "node_intent_classifier_compute"
    type: "node"
    node_name: "node_intent_classifier_compute"
    module: "omniintelligence.nodes.node_intent_classifier_compute"
    description: "Compute node for classifying user prompt intents"
    required: true

  - name: "kafka_producer"
    type: "protocol"
    class_name: "ProtocolKafkaProducer"
    module: "omnibase_infra.protocols.protocol_kafka_producer"
    description: "Kafka producer for emitting classified intent events"
    required: false

# =============================================================================
# IDEMPOTENCY
# =============================================================================
idempotency:
  enabled: true
  strategy: "event_id_tracking"
  hash_fields: ["session_id", "event_type", "timestamp_utc"]
  description: "Each hook event is uniquely identified by session_id, event_type, and
    timestamp_utc. Re-processing the same hook event is idempotent."

# =============================================================================
# METADATA
# =============================================================================
metadata:
  author: "OmniNode Team"
  license: "MIT"
  tags:
    - effect
    - cursor
    - hooks
    - intent-classification
    - kafka
